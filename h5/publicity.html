<body class="h5">

  <div class="h5-veil"></div>
  <div class="h5-frame">
    <header class="h5-top">
      <a class="h5-back" href="activity.html">‹ 返回</a>
      <img class="h5-wordmark h5-wordmark--red" src="../assets/img/mp-wordmark-red.png" alt="MAIN ★ PAPER">
    </header>

    <h2 class="h5-sec">中奖公示</h2>

    <div class="h5-card" style="padding:12px 14px">
      <p class="h5-tip" style="margin:0">按奖池公示：12 月 / 1 月 / 2 月月度奖池、终极大奖池。展示中奖福卡完整 5 位号码、奖项、奖品与脱敏 CIF。公示期 2027-03（具体日期待确认）。</p>
    </div>

    <div class="h5-tabs" id="pub-tabs">
      <button class="h5-tab is-active" data-pool="all" type="button">全部</button>
      <button class="h5-tab" data-pool="m12" type="button">12 月奖池</button>
      <button class="h5-tab" data-pool="m1" type="button">1 月奖池</button>
      <button class="h5-tab" data-pool="m2" type="button">2 月奖池</button>
      <button class="h5-tab" data-pool="ultimate" type="button">终极大奖池</button>
    </div>

    <div class="h5-pub-wrap">
      <table class="h5-pub-table">
        <thead><tr><th style="width:86px">中奖福卡号码</th><th style="width:66px">奖项</th><th>奖品</th><th style="width:78px">CIF</th></tr></thead>
        <tbody id="pub-rows"></tbody>
      </table>
    </div>

    <div class="h5-pub-wrap" id="pub-empty" hidden>
      <div class="h5-empty">
        <div class="h5-empty__ico">奖</div>
        <div class="h5-empty__t">该奖池暂无中奖记录</div>
        <div class="h5-empty__d">抽奖结果发布后在此公示</div>
      </div>
    </div>

    <p class="h5-tip" style="margin-top:14px">如对公示结果有异议，请在公示期内联系活动客服；逾期不再受理。</p>
  </div>

  <script>
    window.PAGE_META = {
      id: "H5-05",

      live: "yes",

        "公示期起止与异议渠道待法务确认。"
      ],
      changes: [
        "公示维度由「奖项等级」改为「奖池」：12 月/1 月/2 月/终极。",
        "新增「中奖福卡号码」列，展示完整 5 位号码。",
        "奖品与奖项按 V2.0 双奖池更新（月度 4 档 + 终极 Tesla/安慰奖）。",
        "公示期改为 2027-03（待确认）。"
      ],
      todo: ["公示期与异议渠道待法务确认。", "安慰奖 1,500 条名单是否全量展示待确认。"]
    };

  </script>

      function render(pool, forceEmpty) {
        var list = forceEmpty ? [] : ROWS.filter(function (r) { return pool === "all" || r.pool === pool; });
        document.getElementById("pub-rows").innerHTML = list.map(function (r) {
          return '<tr><td class="h5-pub-card">' + r.card + '</td>' +
            '<td><span class="h5-pub-level">' + LEVEL[r.level] + '</span></td>' +
            '<td>' + PRIZE[r.level] + '</td>' +
            '<td class="h5-pub-cif">' + r.cif + '</td></tr>';
        }).join("");
        document.getElementById("pub-empty").hidden = list.length > 0;
        document.querySelector(".h5-pub-wrap").hidden = list.length === 0;
        U.$$("#pub-tabs .h5-tab").forEach(function (b) {
          b.classList.toggle("is-active", b.getAttribute("data-pool") === pool);
        });
      }

      U.$$("#pub-tabs .h5-tab").forEach(function (b) {
        b.addEventListener("click", function () { render(b.getAttribute("data-pool"), false); });
      });

      render("all", false);

      window.DEMOS = [
        { label: "12 月奖池", fn: function () { render("m12", false); } },
        { label: "终极大奖池", fn: function () { render("ultimate", false); } },
