<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>礼品展示 · 2026-2027 中汇新年福卡</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/h5.css">
</head>
<body class="h5">
  <video class="h5-bg" autoplay muted loop playsinline preload="metadata"><source src="../assets/video/bg-h5.mp4" type="video/mp4"></video>
  <div class="h5-veil"></div>
  <div class="h5-frame">
    <header class="h5-top">
      <a class="h5-back" href="activity.html">‹ 返回</a>
      <img class="h5-wordmark h5-wordmark--red" src="../assets/img/mp-wordmark-red.png" alt="MAIN ★ PAPER">
    </header>

    <h2 class="h5-sec">礼品展示</h2>

    <div class="h5-card" style="padding:12px 14px">
      <p class="h5-tip" style="margin:0">活动时间：2026-12-01 — 2027-02-26。<br>奖池分「月度奖池（12/1/2 月）」与「终极大奖池」；一张福卡可同时参与月度奖池与终极大奖池，也可同时中奖。</p>
    </div>

    <h3 class="style-section-title">月度奖池（12 月 / 1 月 / 2 月分别独立）</h3>
    <p class="h5-tip" style="margin-top:0">12 月、1 月、2 月各自独立配置奖品与名额（当前三个月奖品一致）；一至四等奖均为福卡 5 位数字全匹配。</p>
    <div class="h5-prize-list" id="monthly-list"></div>

    <h3 class="style-section-title">终极大奖池</h3>
    <p class="h5-tip" style="margin-top:0">覆盖 12/1/2 月全部有效福卡；已中月度奖的福卡不再参与。</p>
    <div class="h5-prize-list" id="ultimate-list"></div>

    <p class="h5-tip">奖品图片由市场部提供；终极大奖开奖时间：2027 年 3 月（具体日期待公布）。具体兑奖由客服微信沟通。</p>
  </div>

  <script>
    window.PAGE_META = {
      id: "H5-04",
      title: "礼品展示",
      live: "yes",
      note: "V2.0：12/1/2 月月度奖池各 4 档 + 终极大奖池 2 档",
      fr: ["FR-015", "FR-022"],
      ac: ["AC-065"],
      goal: "展示月月抽奖池：12 月/1 月/2 月月度奖池各 4 档（分别独立），终极大奖池 Tesla Model 3 1 名 + 参与奖 1,500 名；大奖开奖时间 2027 年 3 月。",
      states: [
        "月度奖池（12 月 / 1 月 / 2 月分别独立）：5888€ MP 随您购 1 名、iPhone Duo 512G 1 名、iPhone 18 Pro Max 2 名、iPad 3 名，均 5 位全匹配。",
        "12 月/1 月/2 月月度奖池分别配置 4 档奖品；终极大奖池：Tesla Model 3 1 名（5 位全匹配）、参与奖 MP 定制礼盒 1,500 名（末位匹配）。",
        "奖品下架/未配置：该档隐藏。"
      ],
      notes: [
        "一张福卡可同时参与月度奖池和终极大奖池，也可同时中奖。",
        "参与奖超过 1,500 名按卡号升序截取，不足不补抽。",
        "终极大奖开奖时间 2027 年 3 月（具体日期待公布）。"
      ],
      changes: [
        "奖品从单池 5 档改为「12 月/1 月/2 月各 4 档 + 终极 2 档」。",
        "按 v11.0 方案替换为 MP 随您购（5888）、iPhone Duo、iPhone 18 Pro Max、iPad、Tesla Model 3、参与奖礼盒。",
        "移除原一等奖机票/代金券、四等奖礼包、五等奖 2,000 名口径。",
        "展示终极大奖开奖时间 2027 年 3 月（待定）；月度开奖时间不展示。提示兑奖改为客服微信。"
      ],
      todo: [
        "新奖品正式图片待市场部提供，当前为占位图。",
        "终极大奖具体日期待运营确认。"
      ]
    };
    window.DEMOS = [
      { label: "查看 12/1/2 月月度奖池", fn: function () { window.scrollTo({ top: document.getElementById("monthly-list").offsetTop - 20, behavior: "smooth" }); } },
      { label: "查看终极大奖池", fn: function () { window.scrollTo({ top: document.getElementById("ultimate-list").offsetTop - 20, behavior: "smooth" }); } }
    ];
  </script>
  <script src="../assets/js/legacy.js"></script>
  <script>
    (function () {
      function card(p) {
        return '<div class="h5-prize">' +
          '<img class="h5-prize__img" src="../assets/img/' + p.img + '" alt="' + p.name + '">' +
          '<div class="h5-prize__name">' + p.name + '</div>' +
          '<div class="h5-prize__meta">名额 ' + p.quota + ' · ' + p.match + '</div>' +
          '</div>';
      }
      var monthly = [
        { img: "prize-monthly-1.png", name: "5888€ MP 随您购", quota: "每月 1 名", match: "5 位全匹配" },
        { img: "prize-monthly-2.png", name: "iPhone Duo 512G 1 台", quota: "每月 1 名", match: "5 位全匹配" },
        { img: "prize-monthly-3.png", name: "iPhone 18 Pro Max 1 台", quota: "每月 2 名", match: "5 位全匹配" },
        { img: "prize-monthly-4.png", name: "iPad 1 台", quota: "每月 3 名", match: "5 位全匹配" }
      ];
      var ultimate = [
        { img: "prize-ultimate-1.png", name: "Tesla Model 3 1 台", quota: "1 名", match: "5 位全匹配" },
        { img: "prize-ultimate-participation.png", name: "MP 定制礼盒 1 份", quota: "1,500 名", match: "末位 1 位匹配" }
      ];
      document.getElementById("monthly-list").innerHTML = monthly.map(card).join("");
      document.getElementById("ultimate-list").innerHTML = ultimate.map(card).join("");
    })();
  </script>
</body>
</html>
