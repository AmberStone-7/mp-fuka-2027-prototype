    <section class="h5-live" id="live-section">
      <div class="h5-live__head">直播抽奖</div>

      <a class="h5-live__btn" id="live-link" href="#" target="_blank" rel="noopener" hidden>观看直播 →</a>

      <div class="h5-live__preview">
        <span>原型状态预览</span>
        <button type="button" data-live="pre1">第一场前</button>
        <button type="button" data-live="pre2">第一场后</button>
        <button type="button" data-live="pre3">第二场后</button>
        <button type="button" data-live="ended">第三场后</button>
      </div>
    </section>

    <p class="h5-home__foot">活动时间 2026.12.01 — 2027.02.26 · 大奖开奖 2027.03</p>
  </div>

  <script>
    window.PAGE_META = {
      id: "H5-01",
      title: "首页（活动入口）",
      live: "yes",
      note: "按 2027 设计图重做；4 个入口替代底部 tab",
      fr: ["FR-010", "FR-012", "FR-014", "FR-022"],
      ac: ["AC-017", "AC-022"],
      goal: "按设计图：顶部红色 MAIN★PAPER + 2027 福卡主视觉 + 四行金色菜单，作为全站入口。",
      states: [
        "活动进行中：四个入口可用。",
        "活动未开始：领取/查询入口点击后提示未开始（子页处理）。",
        "活动已结束：查询入口可看历史结果，领取入口提示已结束。"
      ],
      notes: [
        "入口：领取福卡 / 查询福卡·中奖 / 活动奖项 / 活动细则与赞助，替代原来的底部 5 tab。",
        "子页顶部统一为红色 MAIN★PAPER，左上角返回本页。",
        "中奖公示入口放在「查询福卡/中奖」页与「活动细则与赞助」页。"
      ],
      changes: ["活动时间改为 2026-12-01 至 2027-02-26；活动时间到 2027-02-26；大奖开奖时间 2027 年 3 月。"],
      todo: [
        "首页主视觉使用现有 2027 福卡素材（card-2027.png），如市场部另出主视觉图可替换。",
        "设计图第四项含「赞助」，若今年取消赞助需确认是否改为「活动细则」。"
      ]
    };

    window.DEMOS = [
      { label: "说明：入口结构", fn: function () { U.toast("4 个入口替代底部 tab；子页返回首页"); } }
    ];
  </script>
  <script>
    Object.assign(window.PAGE_META, {
  "api": [
    {
      "method": "GET",
      "path": "/api/campaign/status",
      "desc": "活动状态（未开始/进行中/已结束）、起止时间、抽奖时间；用于入口提示"
    }
  ],
  "fields": [
    "无表单字段；4 个入口为固定链接（领取福卡 / 查询福卡·中奖 / 活动奖项 / 活动细则与赞助）"
  ],
  "rules": [
    "活动未开始/已结束只影响入口提示，不隐藏入口",
    "主视觉素材：assets/img/card-2027.png（红色字标 mp-wordmark-red.png）",
    "入口顺序按 2027 设计图，不随意调整"
  ],
  "permissions": [
    "公开页，无鉴权"
  ],
  "events": [
    "page_view（page=home, lang, device）"
  ],
  "devNotes": [
    "首页为静态页，不查询客户数据",
    "活动状态取 /api/campaign/status，前端只做文案与禁用态",
    "换主视觉只需替换图片，不动结构"
  ]
});
  </script>
  <script src="../assets/js/legacy.js"></script>

  <script>
    (function () {
      var EVENTS = [
        { name: "1 月直播", date: "2027-01-10", pool: "12 月奖池" },
        { name: "2 月直播", date: "2027-02-10", pool: "1 月奖池" },
        { name: "3 月终极直播", date: "2027-03-10", pool: "2 月奖池 + 终极大奖池" }
      ];
      var cover = document.getElementById("live-cover");
      var meta = document.getElementById("live-meta");
      var link = document.getElementById("live-link");
      var tip = document.getElementById("live-tip");
      function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
      function fmtDate(s) { var p = s.split("-"); return parseInt(p[1], 10) + " 月 " + parseInt(p[2], 10) + " 日"; }
      function showPreview(ev, note) {
        cover.innerHTML = "直播预告图<br><span>（运营上传）</span>";
        meta.textContent = "预告 · " + ev.name + " · " + fmtDate(ev.date) + " · 开 " + ev.pool;
        link.hidden = true;
        tip.textContent = note || "直播预告";
      }
      function showLive(ev) {
        cover.innerHTML = "直播中<br><span>点击下方链接进入直播间</span>";
        meta.textContent = "直播中 · " + ev.name + " · " + fmtDate(ev.date) + " · 开 " + ev.pool;
        link.hidden = false;
        link.textContent = "进入直播间 →";
        tip.textContent = "直播进行中；如无法进入请稍后重试。";
      }
      function showEnded() {
        cover.innerHTML = "直播抽奖已结束";
        meta.textContent = "直播抽奖已结束";
        link.hidden = true;
        tip.textContent = "感谢参与 2026-2027 中汇新年福卡活动。";
      }
      function render(force) {
        if (force === "pre1") return showPreview(EVENTS[0], "第一场直播前，展示第一场预告");
        if (force === "pre2") return showPreview(EVENTS[1], "第一场直播后，展示第二场预告");
        if (force === "pre3") return showPreview(EVENTS[2], "第二场直播后，展示第三场预告");
        if (force === "ended") return showEnded();
        var today = startOfDay(new Date());
        var current = null, next = null;
        for (var i = 0; i < EVENTS.length; i++) {
          var d = startOfDay(EVENTS[i].date);
          if (today.getTime() === d.getTime()) { current = EVENTS[i]; break; }
          if (d > today) { next = EVENTS[i]; break; }
        }
        if (current) return showLive(current);
        if (next) {
          var days = Math.ceil((startOfDay(next.date) - today) / 86400000);
          return showPreview(next, "距 " + fmtDate(next.date) + " 还有 " + days + " 天");
        }
        showEnded();
      }
      document.querySelectorAll("[data-live]").forEach(function (b) {
        b.onclick = function () { render(b.getAttribute("data-live")); };
      });
      var initial = new URLSearchParams(location.search).get("live");
      render(initial);
      setInterval(function () { if (!initial) render(); }, 60000);
    })();
  </script>
</body>
</html>
