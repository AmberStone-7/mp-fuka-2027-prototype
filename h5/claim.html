<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>领取福卡 · 2026-2027 中汇新年福卡</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/h5.css">
</head>
<body class="h5">
  <video class="h5-bg" autoplay muted loop playsinline preload="metadata"><source src="../assets/video/bg-h5.mp4" type="video/mp4"></video>
  <div class="h5-veil"></div>
  <div class="h5-frame">
    <header class="h5-top">
      <a class="h5-back" href="activity.html">‹ 返回</a>
      <img class="h5-wordmark h5-wordmark--red" src="../assets/img/mp-wordmark-red.png" alt="MAIN ★ PAPER">
    </header>

    <h2 class="h5-sec">领取福卡</h2>

    <div class="h5-card" style="padding:14px">
      <p class="h5-tip" style="margin:0">输入 <b>CIF</b> 和 <b>邀请码</b>，系统自动识别：<br>· 官方邀请码 → 领取 1 张免费官方福卡<br>· 老客邀请码 → 老带新福卡（新客首单满 1,000€ 后发放）</p>
    </div>

    <section class="h5-form" style="margin-top:14px">
      <div class="h5-field">
        <input class="h5-input" id="cif" placeholder="请输入您的 CIF，示例 B12345678" autocomplete="off">
      </div>
      <div class="h5-field">
        <input class="h5-input h5-input--code" id="invite_code" placeholder="请输入邀请码" maxlength="20" autocomplete="off">
      </div>
      <p class="h5-err" id="claim-err"></p>
      <button class="h5-btn" id="btn-claim" type="button">提交领取</button>
      <p class="h5-tip">老客户邀请码可通过「查询福卡」页面或联系客服获取。</p>
      <p class="h5-tip">原型演示码：官方码 <b>MP2027OFF</b>；老带新待达标 <b>MP2027WAIT</b>；老带新已达标 <b>MP2027OK</b>。</p>
    </section>

    <section id="result" hidden>
      <h3 class="h5-sec" style="font-size:18px;margin:22px 0 12px"><i>◆</i>领取结果<i>◆</i></h3>
      <div id="result-body"></div>
      <p class="h5-tip"><a class="h5-link" href="query.html">前往「查询福卡/中奖」查看全部福卡 →</a></p>
    </section>
  </div>

  <script>
    window.PAGE_META = {
      id: "H5-02",
      title: "领取福卡",
      live: "yes",
      note: "V2.12：一个入口，后端自动识别官方码/老客码；删除我的邀请码",
      fr: ["FR-005", "FR-010", "FR-012"],
      ac: ["AC-030", "AC-031"],
      goal: "输入 CIF + 邀请码领取福利：官方码领取免费官方福卡；老客码走老带新流程；领取成功后展示福卡，重复提交提示已完成并展示原卡。",
      states: [
        "官方码首次领取：展示 1 张红底官方福卡。",
        "官方码重复领取：提示已完成领取，并展示同一张福卡。",
        "老带新待达标：只显示待达标，不展示福卡。",
        "老带新已达标：只展示新客自己的 1 张福卡，不展示邀请人卡号。",
        "信息不匹配/活动未开始/已结束：统一错误提示。"
      ],
      notes: [
        "邀请码类型由后端识别，用户无需选择。",
        "官方码全活动只有一个；同一 CIF 仅能领取 1 张。",
        "老带新达标后，邀请人卡只在邀请人自己的查询页展示。",
        "已删除「我的邀请码」Tab；老客户邀请码通过查询页或客服获取。"
      ],
      changes: [
        "删除我的邀请码 Tab 与相关验证、结果区块。",
        "官方码与老客码合并为一个领取入口。",
        "新增领取成功展示福卡、重复领取提示已完成。",
        "老带新待达标只显示状态，不展示福卡。"
      ],
      todo: [
        "官方邀请码正式码值待运营提供。",
        "需确认活动结束后是否仍可查看已领取福卡（当前允许重复查看）。"
      ]
    };
  </script>
  <script src="../assets/js/legacy.js"></script>
  <script>
    (function () {
      var $ = U.$;
      var claimed = { official: false, referral: false };
      var officialCard = { no: "07001", issued: "2026-12-10", pool: "12 月奖池" };

      function fill(cif, code) {
        $("#cif").value = cif;
        $("#invite_code").value = code;
      }
      function showErr(msg) {
        var el = $("#claim-err");
        el.textContent = msg;
        el.classList.add("is-show");
      }
      function clearErr() { $("#claim-err").classList.remove("is-show"); }

      function officialTicket() {
        return '<article class="ticket ticket--official ticket--pending">' +
          '<div class="ticket__head"><div class="ticket__no-line"><span>幸运福卡号码：</span><b>' + officialCard.no + '</b></div><span class="ticket__stamp">待开奖</span></div>' +
          '<span class="h5-source h5-source--official">官方福卡</span><span class="ticket__pool">' + officialCard.pool + '</span>' +
          '<dl class="ticket__rows">' +
          '<div class="ticket__row"><dt>发放时间：</dt><dd>' + officialCard.issued + '</dd></div>' +
          '<div class="ticket__row"><dt>状态：</dt><dd>待开奖</dd></div>' +
          '</dl>' +
          '<div class="ticket__basis">发放依据：官方邀请码（每 CIF 限 1 张）</div>' +
          '</article>';
      }

      function ownTicket() {
        return '<article class="ticket ticket--win">' +
          '<div class="ticket__head"><div class="ticket__no-line"><span>幸运福卡号码：</span><b>01137</b></div><span class="ticket__stamp">待开奖</span></div>' +
          '<span class="h5-source h5-source--invite">邀请福卡</span><span class="ticket__pool">12 月奖池</span>' +
          '<dl class="ticket__rows">' +
          '<div class="ticket__row"><dt>发放时间：</dt><dd>2026-12-08</dd></div>' +
          '<div class="ticket__row"><dt>状态：</dt><dd>待开奖</dd></div>' +
          '</dl>' +
          '<div class="ticket__basis">发放依据：老带新首单达标（仅展示本人福卡）</div>' +
          '</article>';
      }

      function pendingBlock() {
        return '<div class="h5-notice h5-notice--warn" style="margin-bottom:12px">已记录您与邀请人的绑定关系，待首单满税前 1,000€ 后自动发放福卡。</div>' +
          '<div class="h5-card"><dl class="h5-kv">' +
          '<dt>领取状态</dt><dd>待达标</dd>' +
          '<dt>邀请关系</dt><dd>已绑定</dd>' +
          '<dt>发放条件</dt><dd>新客首单满 1,000€</dd>' +
          '<dt>说明</dt><dd>达标后再次提交可查看本人福卡；邀请人卡不在此页展示</dd>' +
          '</dl></div>';
      }

      function render(kind, repeat) {
        $("#result").hidden = false;
        var box = $("#result-body");
        clearErr();
        if (kind === "official") {
          box.innerHTML = (repeat
            ? '<div class="h5-notice h5-notice--warn" style="margin-bottom:12px">您已完成官方福卡领取，以下是您已领取的福卡。</div>'
            : '<div class="h5-notice h5-notice--success" style="margin-bottom:12px">官方福卡领取成功！</div>') + officialTicket();
        } else if (kind === "referral-pending") {
          box.innerHTML = pendingBlock();
        } else if (kind === "referral-success") {
          box.innerHTML = (repeat
            ? '<div class="h5-notice h5-notice--warn" style="margin-bottom:12px">您已完成老带新福卡领取，以下是您的福卡。</div>'
            : '<div class="h5-notice h5-notice--success" style="margin-bottom:12px">老带新首单已达标，您的福卡已发放。</div>') + ownTicket();
        } else if (kind === "rejected") {
          showErr("信息不匹配，请核对 CIF 与邀请码");
          box.innerHTML = '<div class="h5-empty"><div class="h5-empty__ico">!</div><div class="h5-empty__t">信息不匹配</div><div class="h5-empty__d">码不存在 / 已停用 / 非新客 / 自邀自 / 已超上限，均按统一提示处理</div></div>';
        }
        window.scrollTo({ top: $("#result").offsetTop - 20, behavior: "smooth" });
      }

      function submit() {
        var cif = $("#cif").value.trim();
        var code = $("#invite_code").value.trim().toUpperCase();
        clearErr();
        if (!cif) { showErr("请输入 CIF"); return; }
        if (!code) { showErr("请输入邀请码"); return; }
        if (!/^[A-Z0-9]{6,20}$/.test(code)) { showErr("邀请码为 6–20 位字母或数字"); return; }
        if (/^X/.test(cif)) { render("rejected"); return; }

        var btn = $("#btn-claim");
        btn.disabled = true; btn.textContent = "提交中…";
        setTimeout(function () {
          btn.disabled = false; btn.textContent = "提交领取";
          if (code === "MP2027OFF") {
            render("official", claimed.official);
            claimed.official = true;
          } else if (code === "MP2027WAIT") {
            render("referral-pending");
          } else if (code === "MP2027OK") {
            render("referral-success", claimed.referral);
            claimed.referral = true;
          } else {
            render("rejected");
          }
        }, 500);
      }

      $("#btn-claim").onclick = submit;

      window.DEMOS = [
        { label: "官方码领取成功", fn: function () { fill("B12345678", "MP2027OFF"); submit(); } },
        { label: "官方码重复领取", fn: function () { fill("B12345678", "MP2027OFF"); submit(); submit(); } },
        { label: "老带新待达标", fn: function () { fill("B12345678", "MP2027WAIT"); submit(); } },
        { label: "老带新已达标", fn: function () { fill("B12345678", "MP2027OK"); submit(); } },
        { label: "信息不匹配", fn: function () { fill("X0000000", "BADCODE"); submit(); } }
      ];
    })();
  </script>
</body>
</html>
