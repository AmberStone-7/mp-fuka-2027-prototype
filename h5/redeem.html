<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>礼品领取登记 · 2026-2027 中汇新年福卡</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/h5.css">
</head>
<body class="h5">
  <video class="h5-bg" autoplay muted loop playsinline preload="metadata"><source src="../assets/video/bg-h5.mp4" type="video/mp4"></video>
  <div class="h5-veil"></div>
  <div class="h5-frame">
    <header class="h5-top">
      <a class="h5-back" href="query.html">‹ 返回</a>
      <img class="h5-wordmark h5-wordmark--red" src="../assets/img/mp-wordmark-red.png" alt="MAIN ★ PAPER">
    </header>

    <img class="redeem-hero" src="../assets/img/card-2027.png" alt="2027 中汇新年福卡">
    <h2 class="h5-sec">礼品领取登记</h2>
    <div class="redeem-badge" id="prize-badge">12 月奖池 · 一等奖</div>

    <section class="redeem-panel">
      <div class="redeem-qr">
        <span>客服微信二维码</span>
        <span>（运营提供）</span>
      </div>
      <p class="redeem-panel__text" id="main-text">请添加上方客服微信<br>进行礼品登记</p>
    </section>

    <p class="h5-tip" style="text-align:center">添加客服后请发送：奖项 + 中奖福卡号 + 客户名称，工作人员会尽快为您登记。</p>
  </div>

  <script>
    window.PAGE_META = {
      id: "H5-06",
      title: "礼品领取登记",
      live: "yes",
      note: "V2.8：仅展示客服微信二维码与登记文案，不展示领取说明",
      fr: ["FR-014"],
      ac: ["AC-045", "AC-058"],
      goal: "中奖客户进入本页：所有奖项展示客服微信二维码与登记文案；不展示奖品领取说明；参与奖沿用订单备注提示。",
      states: [
        "12 月/1 月/2 月月度奖池一至四等奖：客服微信 + 对应奖品说明。",
        "终极一等奖：客服微信 + Tesla 领取条件。",
        "参与奖：客服微信 + 联系客服或业务员、订单备注提示。"
      ],
      notes: [
        "所有奖品统一一个客服微信二维码，不再按奖项区分微信。",
        "Tesla 需欧盟驾照/身份证明、年龄≥21、西班牙半岛提车、税费保险自理。",
        "iPhone 可自费升级 1 次；iPad 不可升级；MP 随您购有效期至 2027-12-31、不可兑现金。",
        "中奖公示展示完整福卡号。"
      ],
      changes: [
        "所有奖项统一客服微信二维码。",
        "V2.8 删除页面下方「领取说明」区域，只保留二维码与登记文案。",
        "参与奖沿用订单备注提示。"
      ],
      todo: ["客服微信二维码待运营提供，当前为占位。", "参与奖随单起始时间待运营确认。"]
    };
    window.DEMOS = [
      { label: "12 月奖池一等奖（5888）", fn: function () { setPrize("monthly1", "12 月奖池"); } },
      { label: "1 月奖池二等奖（iPhone Duo）", fn: function () { setPrize("monthly2", "1 月奖池"); } },
      { label: "2 月奖池三等奖（iPhone 18 Pro Max）", fn: function () { setPrize("monthly3", "2 月奖池"); } },
      { label: "2 月奖池四等奖（iPad）", fn: function () { setPrize("monthly4", "2 月奖池"); } },
      { label: "终极大奖池一等奖（Tesla）", fn: function () { setPrize("ultimate1", "终极大奖池"); } },
      { label: "终极参与奖（订单备注）", fn: function () { setPrize("participation", "终极大奖池"); } }
    ];
  </script>
  <script src="../assets/js/legacy.js"></script>
  <script>
    (function () {
      var MAP = {
        monthly1: { badge: "一等奖", tips: "MP 随您购：总价值 5888 欧元（税前）的 MP 产品包，可自行点货；超出部分自付；有效期至 2027-12-31，不可兑换现金。" },
        monthly2: { badge: "二等奖", tips: "iPhone Duo 512G：完成登记后可选择自费升级库存或自选颜色，需补齐差价；升级仅限 1 次，升级后不可降级。" },
        monthly3: { badge: "三等奖", tips: "iPhone 18 Pro Max：完成登记后可选择自费升级库存或自选颜色，需补齐差价；升级仅限 1 次，升级后不可降级。" },
        monthly4: { badge: "四等奖", tips: "iPad：此礼品不支持兑换现金，也不支持自费升级。" },
        ultimate1: { badge: "终极一等奖", tips: "Tesla Model 3：需持欧盟有效驾照及官方身份证明，年龄≥21 周岁；仅支持西班牙半岛提车；个人税费、保险、上牌等费用自理；不可兑换现金。" },
        participation: { badge: "参与奖", tips: "请联系客服或业务员，在下单时备注【2027 福卡参与奖】；礼品随单发放，具体以客服/业务员沟通为准。" }
      };
      function setPrize(code, pool) {
        var p = MAP[code] || MAP.monthly1;
        document.getElementById("prize-badge").textContent = (pool ? pool + " · " : "") + p.badge;
        var isPart = code === "participation";
        document.getElementById("main-text").innerHTML = isPart
          ? "请联系客服或业务员<br>下单备注<br>“2027 福卡参与奖”"
          : "请添加上方客服微信<br>进行礼品登记";
      }
      var qs = new URLSearchParams(location.search);
      var code = qs.get("prize") || "monthly1";
      setPrize(code, qs.get("pool") || (code === "ultimate1" || code === "participation" ? "终极大奖池" : ""));
    })();
  </script>
</body>
</html>
