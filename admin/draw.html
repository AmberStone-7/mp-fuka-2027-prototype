<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>抽奖管理 · 抽奖后台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261110b">
  <style>
    .draw-snap { display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:#f6f8ff;border:1px solid #d6e4ff;border-radius:8px;font-size:13px;color:#1f3b66 }
    .draw-snap b { color:#0958d9 }
    .draw-snap__btn { margin-left:auto }
    .draw-match-wrap { max-height:420px;overflow:auto;border:1px solid #f0f0f0;border-radius:6px }
    .draw-match { width:100%;border-collapse:collapse;font-size:13px }
    .draw-match th,.draw-match td { padding:8px 10px;border-bottom:1px solid #f2f2f2;text-align:left;white-space:nowrap }
    .draw-match th { position:sticky;top:0;background:#fafafa;font-weight:600;color:#595959;z-index:1 }
    .draw-match-pager { display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:13px;color:#595959 }
    .draw-match-pager button { min-width:28px;height:28px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer }
    .draw-match-pager button.is-active { border-color:#1677ff;color:#1677ff }
    .draw-summary { font-size:13px;color:#595959;margin-bottom:10px;line-height:1.8 }
    .draw-summary b { color:#262626 }
    .adm-modal__box--wide { width:900px;max-width:96vw }
    .draw-st--draft { color:#d48806 }
    .draw-st--reviewed { color:#1677ff }
    .draw-st--published { color:#389e0d }
    .draw-warn { color:#cf1322 }
  </style>
</head>
<body class="adm">
<aside class="adm-sider">
  <div class="adm-logo">抽奖后台管理</div>
  <nav class="adm-menu" aria-label="后台菜单">
    <a class="adm-menu__item" href="cards.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M8 15h4"/></svg>福卡管理</a>
    <a class="adm-menu__item" href="invite.html"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-6l3-3a4 4 0 0 1 6 6l-2 2"/><path d="M14 10a4 4 0 0 1 0 6l-3 3a4 4 0 0 1-6-6l2-2"/></svg>邀请码管理</a>
    <a class="adm-menu__item is-active" href="draw.html"><svg viewBox="0 0 24 24"><path d="M5 10v4l9 4V6L5 10z"/><path d="M14 9a3.5 3.5 0 0 1 0 6"/><path d="M7 14v4"/></svg>抽奖管理</a>
    <a class="adm-menu__item" href="prizes.html"><svg viewBox="0 0 24 24"><path d="M4 11h16v9H4z"/><path d="M3 7h18v4H3z"/><path d="M12 7v13"/></svg>奖品管理</a>
    <a class="adm-menu__item" href="winners.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>中奖记录</a>
    <a class="adm-menu__item" href="email.html"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 8l9 6 9-6"/></svg>邮件日志</a>
  </nav>
  <button class="adm-sider__collapse" type="button" title="收起菜单">‹</button>
</aside>

<main class="adm-main">
  <div class="adm-topbar"><span class="adm-avatar">A</span></div>
  <div class="adm-crumb"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>/</span><b>抽奖管理</b></div>

  <form class="adm-filters" id="filters" onsubmit="return false">
    <div class="adm-field">
      <label for="f-pool">奖池</label>
      <select class="adm-select" id="f-pool">
        <option value="m12">12 月月度奖池</option>
        <option value="m1">1 月月度奖池</option>
        <option value="m2">2 月月度奖池</option>
        <option value="ultimate">终极大奖池</option>
      </select>
    </div>
    <div class="adm-field">
      <label for="f-batch">序号</label>
      <input class="adm-input" id="f-batch" placeholder="请输入序号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-status">状态</label>
      <select class="adm-select" id="f-status">
        <option value="">全部状态</option>
        <option value="draft">草稿</option>
        <option value="reviewed">已复核（待发布）</option>
        <option value="published">已发布</option>
      </select>
    </div>
    <div class="adm-filters__btns">
      <button class="adm-btn adm-btn--primary" id="btn-search" type="button">查 询</button>
      <button class="adm-btn" id="btn-reset" type="button">重 置</button>
    </div>
  </form>

  <div class="adm-actions">
    <button class="adm-btn" id="btn-export" type="button">导 出</button>
    <button class="adm-btn adm-btn--primary" id="btn-add" type="button" style="margin-left:auto">添加抽奖结果</button>
  </div>

  <div class="adm-table-wrap">
    <table class="adm-table" style="min-width:1100px">
      <thead><tr><th>序号</th><th>奖池</th><th>奖品</th><th>幸运数字</th><th>命中</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="adm-pager" id="pager"></div>
</main>

<!-- 添加/编辑抽奖结果 -->
<div class="adm-modal" id="modal-result" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-result-title">
    <div class="adm-modal__head"><span class="adm-modal__title" id="modal-result-title">添加抽奖结果</span><button class="adm-modal__close" type="button" data-close>×</button></div>
    <div class="adm-modal__body">
      <div class="adm-form-item">
        <label>奖池</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="r-pool">
            <option value="m12">12 月月度奖池</option>
            <option value="m1">1 月月度奖池</option>
            <option value="m2">2 月月度奖池</option>
            <option value="ultimate">终极大奖池</option>
          </select>
        </div>
      </div>
      <div class="adm-form-item" id="item-prize">
        <label class="required" for="r-prize">奖品</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="r-prize"></select>
          <p class="adm-form-item__err">请选择奖品</p>
        </div>
      </div>
      <div class="adm-form-item" id="item-num">
        <label class="required" for="r-num">幸运数字</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="r-num" inputmode="numeric" maxlength="5" placeholder="请输入幸运数字">
          <p class="adm-form-item__err" id="err-num">输入不满足要求</p>
          <p class="adm-form-tip" id="num-tip"></p>
        </div>
      </div>
      <p class="adm-form-tip">确认后展示匹配福卡，核对后保存草稿；提交复核通过后才能发布。</p>
    </div>
    <div class="adm-modal__foot"><button class="adm-btn" type="button" data-close>取 消</button><button class="adm-btn adm-btn--primary" type="button" id="btn-confirm">确 认</button></div>
  </div>
</div>

<!-- 匹配福卡 -->
<div class="adm-modal" id="modal-match" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box adm-modal__box--wide" role="dialog" aria-modal="true" aria-labelledby="modal-match-title">
    <div class="adm-modal__head"><span class="adm-modal__title" id="modal-match-title">抽奖结果</span><button class="adm-modal__close" type="button" data-close>×</button></div>
    <div class="adm-modal__body">
      <div class="draw-summary" id="match-summary"></div>
      <div class="draw-match-wrap">
        <table class="draw-match"><thead><tr><th>账套</th><th>幸运福卡卡号</th><th>客户号</th><th>业务员号</th><th>客户手机号</th><th>发票号</th></tr></thead><tbody id="match-rows"></tbody></table>
      </div>
      <div class="draw-match-pager"><span id="match-total"></span><button type="button" id="match-prev">‹</button><span id="match-page-btns" style="display:flex;gap:6px"></span><button type="button" id="match-next">›</button><select id="match-size"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select></div>
    </div>
    <div class="adm-modal__foot"><button class="adm-btn" type="button" id="btn-regenerate">重新生成</button><button class="adm-btn adm-btn--primary" type="button" id="btn-save-result">确认开奖结果</button></div>
  </div>
</div>

<!-- 发布确认 -->
<div class="adm-modal" id="modal-publish" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-publish-title">
    <div class="adm-modal__head"><span class="adm-modal__title" id="modal-publish-title">发布中奖结果</span><button class="adm-modal__close" type="button" data-close>×</button></div>
    <div class="adm-modal__body">
      <div class="draw-summary" id="publish-summary"></div>
      <div class="adm-alert" style="margin-top:4px"><span class="adm-alert__ico">!</span><span><b class="draw-warn">发布后不可撤回。</b>发布后福卡状态与中奖公示将同步到 H5。</span></div>
    </div>
    <div class="adm-modal__foot"><button class="adm-btn" type="button" data-close>取 消</button><button class="adm-btn adm-btn--primary" type="button" id="btn-publish-ok">确认发布</button></div>
  </div>
</div>

<script>
  window.PAGE_META = {
    id: "ADM-03", title: "抽奖管理", live: "yes",
    note: "V2.0：双奖池 + 重抽 + 发布前复核",
    fr: ["FR-015"], ac: ["AC-065", "AC-066", "AC-067", "AC-069"],
    goal: "按奖池录入幸运数字：12 月/1 月/2 月各 4 档、终极 2 档（抽奖前先选奖池）；校验通过展示匹配福卡，保存草稿→提交复核→发布；发布后同步 H5，不可撤回。",
    states: [
      "月度 1–4 等奖：5 位全匹配；无中奖可重抽（按细则 1 次）。",
      "终极一等奖：5 位全匹配，可持续重抽至中奖；参与奖：末位匹配、1,500 名截取、不补抽。",
      "状态：草稿 → 已复核 → 已发布；发布前必须复核。",
      "发布后不可撤回。"
    ],
    changes: [
      "新增奖池选择：12 月/1 月/2 月/终极。",
      "奖品按奖池切换：月度 4 档、终极 2 档。",
      "新增重抽（重新生成）与发布前复核状态。",
      "参与奖 1,500 名、末位匹配、超额升序截取。",
      "发布后同步 H5 福卡与中奖公示。"
    ],
    notes: ["系统记录投球结果与重抽记录。", "发布后不可撤回。"],
    todo: ["月度无中奖最终处理待运营确认。"]
  };
</script>
<script src="../assets/js/legacy.js?v=20261110b"></script>
<script>
(function () {
  var $ = U.$, $$ = U.$$;
  var POOL_NAME = { m12: "12 月月度奖池", m1: "1 月月度奖池", m2: "2 月月度奖池", ultimate: "终极大奖池" };
  var PRIZES = {
    m12: [
      { key: "m12-1", name: "一等奖 · 5888€ MP 随您购", quota: 1, digits: 5 },
      { key: "m12-2", name: "二等奖 · iPhone Duo 512G", quota: 1, digits: 5 },
      { key: "m12-3", name: "三等奖 · iPhone 18 Pro Max", quota: 2, digits: 5 },
      { key: "m12-4", name: "四等奖 · iPad", quota: 3, digits: 5 }
    ],
    m1: [], m2: [],
    ultimate: [
      { key: "u-1", name: "一等奖 · Tesla Model 3", quota: 1, digits: 5 },
      { key: "u-p", name: "参与奖 · MP 定制礼盒", quota: 1500, digits: 1 }
    ]
  };
  PRIZES.m1 = PRIZES.m12; PRIZES.m2 = PRIZES.m12;
  var STATUS = { draft: "草稿", reviewed: "已复核（待发布）", published: "已发布" };
  var PAGE_SIZE = 10, page = 1;

  var state = {
    rows: [
      { id: "B20261231-01", pool: "m12", prize: "一等奖 · 5888€ MP 随您购", lucky: "03112", matched: 1, status: "draft", time: "2026-12-31 20:10" },
      { id: "B20261231-02", pool: "m12", prize: "二等奖 · iPhone Duo 512G", lucky: "04218", matched: 1, status: "reviewed", time: "2026-12-31 20:05" },
      { id: "B20261231-03", pool: "m12", prize: "三等奖 · iPhone 18 Pro Max", lucky: "05120", matched: 2, status: "published", time: "2026-12-31 20:00" },
      { id: "B20270226-01", pool: "ultimate", prize: "一等奖 · Tesla Model 3", lucky: "01208", matched: 1, status: "draft", time: "2027-02-26 21:00" },
      { id: "B20270226-02", pool: "ultimate", prize: "参与奖 · MP 定制礼盒", lucky: "6", matched: 1500, status: "draft", time: "2027-02-26 20:58" }
    ],
    all: null, page: 1, editId: null, pool: "m12", match: null, matchPage: 1, matchSize: 10
  };
  state.all = state.rows.filter(function (r) { return r.pool === 'm12'; });

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function luckyText(r) { return r.prize.indexOf("参与奖") >= 0 ? "末位 " + r.lucky : r.lucky; }
  function pageRows() { var s = (state.page - 1) * PAGE_SIZE; return state.all.slice(s, s + PAGE_SIZE); }
  function render() {
    $("#rows").innerHTML = pageRows().map(function (r) {
      var ops = '<button type="button" data-act="view" data-id="' + r.id + '">查看</button>';
      if (r.status === "draft") ops = '<button type="button" data-act="edit" data-id="' + r.id + '">编辑</button><button type="button" data-act="review" data-id="' + r.id + '">提交复核</button>' + ops;
      if (r.status === "reviewed") ops = '<button type="button" data-act="publish" data-id="' + r.id + '">发布</button>' + ops;
      return "<tr><td class='num'>" + (state.rows.indexOf(r) + 1) + "</td><td>" + POOL_NAME[r.pool] + "</td><td>" + r.prize + "</td><td class='num'>" + luckyText(r) + "</td><td class='num'>" + fmt(r.matched) + "</td><td><span class='adm-status draw-st--" + r.status + "'>" + STATUS[r.status] + "</span></td><td class='muted nowrap'>" + r.time + "</td><td><span class='adm-table__op'>" + ops + "</span></td></tr>";
    }).join("");
    var pages = Math.max(1, Math.ceil(state.all.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    $("#pager").innerHTML = '<span class="adm-pager__total">共 ' + state.all.length + ' 条</span>' +
      '<button type="button" ' + (state.page <= 1 ? "disabled" : "") + ' data-page="' + (state.page - 1) + '">‹</button>' +
      Array.from({ length: pages }, function (_, i) { return i + 1; }).map(function (n) { return '<button type="button" class="' + (n === state.page ? "is-active" : "") + '" data-page="' + n + '">' + n + "</button>"; }).join("") +
      '<button type="button" ' + (state.page >= pages ? "disabled" : "") + ' data-page="' + (state.page + 1) + '">›</button>';
    bind();
  }
  function bind() {
    $$("[data-page]").forEach(function (b) { b.onclick = function () { state.page = Number(b.getAttribute("data-page")); render(); }; });
    $$("[data-act]").forEach(function (b) {
      var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
      b.onclick = function () {
        if (act === "edit") openAdd(id);
        if (act === "review") { var r = find(id); r.status = "reviewed"; render(); U.toast("已提交复核（复核人：管理员 A）"); }
        if (act === "publish") openPublish(id);
        if (act === "view") { var x = find(id); U.toast(POOL_NAME[x.pool] + " · " + x.prize + " · 命中 " + fmt(x.matched)); }
      };
    });
  }
  function find(id) { return state.all.find(function (r) { return r.id === id; }); }
  function openModal(id) { var m = document.getElementById(id); m.classList.add("is-open"); m.setAttribute("aria-hidden", "false"); }
  function closeModal(m) { m.classList.remove("is-open"); m.setAttribute("aria-hidden", "true"); }
  $$("[data-close]").forEach(function (b) { b.onclick = function () { closeModal(b.closest(".adm-modal")); }; });

  function fillPrizeOptions() {
    $("#r-prize").innerHTML = PRIZES[state.pool].map(function (p) { return '<option value="' + p.key + '">' + p.name + '（名额 ' + p.quota + '）</option>'; }).join("");
  }
  function selectedPrize() { return PRIZES[state.pool].find(function (p) { return p.key === $("#r-prize").value; }); }
  function updateTip() {
    var p = selectedPrize();
    $("#num-tip").textContent = p && p.digits === 1 ? "参与奖：请输入 0–9 的一位数字（末位匹配）" : "一至四等奖/终极一等奖：请输入 00001–20000 之间的 5 位数字";
    $("#r-num").setAttribute("maxlength", p && p.digits === 1 ? "1" : "5");
  }
  $("#r-prize").onchange = updateTip;
  $("#r-pool").onchange = function () { state.pool = this.value; fillPrizeOptions(); $("#r-num").value = ""; updateTip(); };

  function openAdd(id) {
    state.editId = id || null;
    var r = id ? find(id) : null;
    if (r) state.pool = r.pool;
    $("#r-pool").value = state.pool;
    fillPrizeOptions();
    $("#r-prize").value = r ? PRIZES[state.pool].find(function (p) { return p.name === r.prize; }).key : PRIZES[state.pool][0].key;
    $("#r-num").value = r ? r.lucky : "";
    $("#modal-result-title").textContent = id ? "编辑抽奖结果 · " + id : "添加抽奖结果";
    $("#item-prize").classList.remove("is-error"); $("#item-num").classList.remove("is-error");
    updateTip();
    openModal("modal-result");
  }
  $("#f-pool").onchange = function () { state.pool = this.value; state.all = state.rows.filter(function (r) { return r.pool === state.pool; }); state.page = 1; render(); };
  $("#btn-add").onclick = function () { openAdd(); };

  $("#btn-confirm").onclick = function () {
    var p = selectedPrize();
    var num = $("#r-num").value.trim();
    var err = "";
    if (!p) err = "请选择奖品";
    else if (p.digits === 1) { if (!/^\d$/.test(num)) err = "请输入 0–9 的一位数字"; }
    else { if (!/^\d{5}$/.test(num)) err = "请输入 00001–20000 之间位数为 5 位的数字"; else { var n = parseInt(num, 10); if (n < 1 || n > 20000) err = "请输入 00001–20000 之间位数为 5 位的数字"; } }
    if (err) { $("#err-num").textContent = err; $("#item-num").classList.add("is-error"); $("#item-prize").classList.add("is-error"); return; }
    var count = p.quota;
    if (p.key === "u-p") count = 1500;
    state.match = { pool: state.pool, prize: p, num: num, count: count };
    closeModal(document.getElementById("modal-result"));
    $("#match-summary").innerHTML = "奖池：<b>" + POOL_NAME[state.pool] + "</b>　奖品：<b>" + p.name + "</b>　幸运数字：<b>" + (p.digits === 1 ? "末位 " + num : num) + "</b>　命中：<b>" + fmt(count) + "</b> 条";
    state.matchPage = 1; state.matchSize = 10;
    renderMatch(); openModal("modal-match");
  };

  function buildRows(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push({ account: "ES0" + (1 + i % 3), card: String(3000 + i).padStart(5, "0"), cif: "1000" + String(1600 + i).slice(-4) + "A" + i % 10, sales: String(5000 + i % 40), phone: "6" + String(i * 137).padStart(8, "0").slice(0, 8), invoice: "ES2500" + String(1000 + i).slice(-4) });
    return a;
  }
  function renderMatch() {
    var m = state.match, rows = buildRows(m.count), total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.matchSize));
    if (state.matchPage > pages) state.matchPage = pages;
    var start = (state.matchPage - 1) * state.matchSize;
    $("#match-rows").innerHTML = rows.slice(start, start + state.matchSize).map(function (r) { return "<tr><td>" + r.account + "</td><td class='num'>" + r.card + "</td><td class='num'>" + r.cif + "</td><td class='num'>" + r.sales + "</td><td class='num'>" + r.phone + "</td><td class='num'>" + r.invoice + "</td></tr>"; }).join("");
    $("#match-total").textContent = "共 " + fmt(total) + " 条";
    $("#match-page-btns").innerHTML = Array.from({ length: Math.min(5, pages) }, function (_, i) { return i + 1; }).map(function (n) { return '<button type="button" class="' + (n === state.matchPage ? "is-active" : "") + '" data-mpage="' + n + '">' + n + "</button>"; }).join("");
    $$("[data-mpage]").forEach(function (b) { b.onclick = function () { state.matchPage = Number(b.getAttribute("data-mpage")); renderMatch(); }; });
    $("#match-prev").onclick = function () { if (state.matchPage > 1) { state.matchPage--; renderMatch(); } };
    $("#match-next").onclick = function () { if (state.matchPage < pages) { state.matchPage++; renderMatch(); } };
    $("#match-size").onchange = function () { state.matchSize = parseInt(this.value, 10) || 10; state.matchPage = 1; renderMatch(); };
  }
  $("#btn-regenerate").onclick = function () { closeModal(document.getElementById("modal-match")); openAdd(state.editId); };
  $("#btn-save-result").onclick = function () {
    var m = state.match;
    var id = state.editId || ("B-" + Date.now().toString().slice(-6));
    var row = { id: id, pool: m.pool, prize: m.prize.name, lucky: m.num, matched: m.count, status: "draft", time: "2027-02-26 21:00" };
    if (state.editId) { var i = state.all.findIndex(function (x) { return x.id === state.editId; }); if (i >= 0) state.all[i] = row; }
    else state.all.unshift(row);
    closeModal(document.getElementById("modal-match"));
    render(); U.toast("已保存为草稿，请提交复核");
  };

  function openPublish(id) {
    var r = find(id); state.publishId = id;
    $("#publish-summary").innerHTML = "序号：<b>" + (state.rows.indexOf(r) + 1) + "</b>　奖池：<b>" + POOL_NAME[r.pool] + "</b>　奖品：<b>" + r.prize + "</b>　命中：<b>" + fmt(r.matched) + "</b> 条";
    openModal("modal-publish");
  }
  $("#btn-publish-ok").onclick = function () {
    var r = find(state.publishId); if (r) { r.status = "published"; r.time = "2027-03-01 10:00"; }
    closeModal(document.getElementById("modal-publish")); render(); U.toast("已发布：已同步 H5 福卡状态与中奖公示");
  };
  $("#btn-search").onclick = function () {
    var pool = $("#f-pool").value, seq = $("#f-batch").value.trim(), st = $("#f-status").value;
    state.all = state.rows.filter(function (r) { return r.pool === pool && (!seq || (state.rows.indexOf(r) + 1) === Number(seq)) && (!st || r.status === st); });
    state.page = 1; render();
  };
  $("#btn-reset").onclick = function () { $("#filters").reset(); state.pool = "m12"; state.all = state.rows.slice(); state.page = 1; render(); };
  $("#btn-export").onclick = function () { U.toast("导出抽奖结果（演示）"); };
  window.DEMOS = [
    { label: "12 月一等奖录入", fn: function () { state.pool = "m12"; $("#f-pool").value = "m12"; openAdd(); } },
    { label: "终极一等奖（Tesla）", fn: function () { state.pool = "ultimate"; $("#f-pool").value = "ultimate"; openAdd(); } },
    { label: "参与奖（末位匹配）", fn: function () { state.pool = "ultimate"; $("#f-pool").value = "ultimate"; openAdd(); $("#r-prize").value = "u-p"; updateTip(); } },
    { label: "提交复核", fn: function () { var r = state.rows.find(function (x) { return x.status === "draft"; }); if (r) { r.status = "reviewed"; render(); U.toast("已提交复核"); } } }
  ];
  render();
})();
</script>
</body>
</html>
