<!doctype html>
<html lang="zh-CN">

  <style>
    .draw-snap { display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;background:#f6f8ff;border:1px solid #d6e4ff;border-radius:8px;font-size:13px;color:#1f3b66 }
    .draw-snap b { color:#0958d9 }
    .draw-snap__btn { margin-left:auto }
    .draw-match-wrap { max-height:420px;overflow:auto;border:1px solid #f0f0f0;border-radius:6px }
    .draw-match { width:100%;border-collapse:collapse;font-size:13px }
    .draw-match th,.draw-match td { padding:8px 10px;border-bottom:1px solid #f2f2f2;text-align:left;white-space:nowrap }
    .draw-match th { position:sticky;top:0;background:#fafafa;font-weight:600;color:#595959;z-index:1 }
    .draw-match-pager { display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:13px;color:#595959 }
    .draw-match-pager button { min-width:28px;height:28px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer }
    .draw-match-pager button.is-active { border-color:#1677ff;color:#1677ff }
    .draw-summary { font-size:13px;color:#595959;margin-bottom:10px;line-height:1.8 }
    .draw-checks { margin-bottom:12px;border:1px solid #f0f0f0;border-radius:8px;overflow:hidden }
    .draw-check { display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid #f5f5f5;font-size:13px }
    .draw-check:last-child { border-bottom:0 }
    .draw-check__no { width:82px;color:#8c8c8c }
    .draw-check__num { width:74px;font-family:Menlo,monospace;font-weight:700;color:#262626 }
    .draw-check__result { flex:1;color:#389e0d }
    .draw-check.is-bad { background:#fff2f0 }
    .draw-check.is-bad .draw-check__num,
    .draw-check.is-bad .draw-check__result { color:#cf1322 }
    .draw-check__tag { display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d;margin-left:6px }
    .draw-check.is-bad .draw-check__tag { background:#fff2f0;border-color:#ffccc7;color:#cf1322 }

    .draw-summary b { color:#262626 }
    .adm-modal__box--wide { width:900px;max-width:96vw }
    .draw-st--draft { color:#d48806 }
    .draw-st--reviewed { color:#1677ff }
    .draw-st--published { color:#389e0d }
    .draw-warn { color:#cf1322 }
  </style>

<!-- 添加/编辑抽奖结果 -->
<div class="adm-modal" id="modal-result" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-result-title">
    <div class="adm-modal__head"><span class="adm-modal__title" id="modal-result-title">添加抽奖结果</span><button class="adm-modal__close" type="button" data-close>×</button></div>
    <div class="adm-modal__body">
      <div class="adm-form-item">
        <label>奖池</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="r-pool">
            <option value="m12">12 月月度奖池</option>
            <option value="m1">1 月月度奖池</option>
            <option value="m2">2 月月度奖池</option>
            <option value="ultimate">终极大奖池</option>
          </select>
        </div>
      </div>
      <div class="adm-form-item" id="item-prize">
        <label class="required" for="r-prize">奖品</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="r-prize"></select>
          <p class="adm-form-item__err">请选择奖品</p>
        </div>
      </div>
      <div class="adm-form-item">
        <label>中奖数量</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="r-quota" readonly placeholder="根据奖品自动带出">

        </div>
      </div>
      <div class="adm-form-item" id="item-num">
        <label class="required">幸运数字</label>
        <div class="adm-form-item__ctrl">
          <div id="r-nums" style="display:flex;flex-direction:column;gap:8px"></div>
          <p class="adm-form-item__err" id="err-num">输入不满足要求</p>
          <p class="adm-form-tip" id="num-tip"></p>
        </div>

      <p class="adm-form-tip">确认后展示匹配福卡，核对后生成抽奖结果；生成后状态为「待发布」。</p>
    </div>
    <div class="adm-modal__foot"><button class="adm-btn" type="button" data-close>取 消</button><button class="adm-btn adm-btn--primary" type="button" id="btn-confirm">确 认</button></div>
  </div>
</div>

<!-- 匹配福卡 -->
<div class="adm-modal" id="modal-match" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box adm-modal__box--wide" role="dialog" aria-modal="true" aria-labelledby="modal-match-title">
    <div class="adm-modal__head"><span class="adm-modal__title" id="modal-match-title">抽奖结果</span><button class="adm-modal__close" type="button" data-close>×</button></div>

      <div id="num-checks" class="draw-checks"></div>
      <div class="draw-summary" id="match-summary"></div>
      <div class="draw-match-wrap">
        <table class="draw-match"><thead><tr><th>账套</th><th>幸运福卡卡号</th><th>客户号</th><th>业务员号</th><th>客户手机号</th><th>发票号</th></tr></thead><tbody id="match-rows"></tbody></table>

      <div class="draw-match-pager"><span id="match-total"></span><button type="button" id="match-prev">‹</button><span id="match-page-btns" style="display:flex;gap:6px"></span><button type="button" id="match-next">›</button><select id="match-size"><option value="10">10 条/页</option><option value="20">20 条/页</option><option value="50">50 条/页</option></select></div>
    </div>

</div>

<script>
(function () {
  var $ = U.$, $$ = U.$$;
  var POOL_NAME = { m12: "12 月月度奖池", m1: "1 月月度奖池", m2: "2 月月度奖池", ultimate: "终极大奖池" };
  var PRIZES = {
    m12: [
      { key: "m12-1", name: "一等奖 · 5888€ MP 随您购", quota: 1, digits: 5 },
      { key: "m12-2", name: "二等奖 · iPhone Duo 512G", quota: 1, digits: 5 },
      { key: "m12-3", name: "三等奖 · iPhone 18 Pro Max", quota: 2, digits: 5 },
      { key: "m12-4", name: "四等奖 · iPad", quota: 3, digits: 5 }
    ],
    m1: [], m2: [],
    ultimate: [
      { key: "u-1", name: "一等奖 · Tesla Model 3", quota: 1, digits: 5 },
      { key: "u-p", name: "参与奖 · MP 定制礼盒", quota: 1500, digits: 1 }
    ]
  };
  PRIZES.m1 = PRIZES.m12; PRIZES.m2 = PRIZES.m12;
  // 演示卡池：与「福卡管理」12 月待开奖卡保持一致；
  // 1/2 月暂时复用同一批演示卡，便于联调。
  var MONTHLY_CARDS = [
    "01136", "01135", "01133", "01139", "01131", "01129", "01128", "01127",
    "03112", "04218", "05120", "06133", "07108", "07215", "07322"
  ];
  var CARD_POOL = {
    m12: MONTHLY_CARDS,
    m1: MONTHLY_CARDS,
    m2: MONTHLY_CARDS,
    ultimate: ["01208", "01136", "02145", "02266", "02377", "02488"]
  };
  var STATUS = { pending: "待发布", published: "已发布" };
  var PAGE_SIZE = 10;

  var state = {
    rows: [
      { id: "B20261231-01", pool: "m12", prize: "一等奖 · 5888€ MP 随您购", quota: 1, luckies: ["03112"], matched: 1, status: "pending", time: "2026-12-31 20:10" },
      { id: "B20261231-02", pool: "m12", prize: "二等奖 · iPhone Duo 512G", quota: 1, luckies: ["04218"], matched: 1, status: "pending", time: "2026-12-31 20:05" },
      { id: "B20261231-03", pool: "m12", prize: "三等奖 · iPhone 18 Pro Max", quota: 2, luckies: ["05120", "06133"], matched: 2, status: "published", time: "2026-12-31 20:00" },
      { id: "B20270226-01", pool: "ultimate", prize: "一等奖 · Tesla Model 3", quota: 1, luckies: ["01208"], matched: 1, status: "pending", time: "2027-02-26 21:00" },
      { id: "B20270226-02", pool: "ultimate", prize: "参与奖 · MP 定制礼盒", quota: 1500, luckies: ["6"], matched: 1500, status: "pending", time: "2027-02-26 20:58" }
    ],
    all: null, page: 1, editId: null, pool: "m12", match: null, matchPage: 1, matchSize: 10,
    lastNums: null, lastInvalid: [], lastPrize: null
  };
  state.all = state.rows.filter(function (r) { return r.pool === "m12"; });

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function luckyText(r) {
    var v = r.luckies || (r.lucky ? String(r.lucky).split("、") : []);
    return r.prize.indexOf("参与奖") >= 0 ? "末位 " + v[0] : v.join("、");
  }
  function prizeOf(pool, name) { return PRIZES[pool].find(function (p) { return p.name === name; }); }
  function pageRows() { var s = (state.page - 1) * PAGE_SIZE; return state.all.slice(s, s + PAGE_SIZE); }

  function render() {
    $("#rows").innerHTML = pageRows().map(function (r) {
      var ops = '<button type="button" data-act="view" data-id="' + r.id + '">查看</button>';
      if (r.status === "pending") ops = '<button type="button" data-act="publish" data-id="' + r.id + '">发布</button><button type="button" data-act="edit" data-id="' + r.id + '">编辑</button>' + ops;
      return "<tr><td class='num'>" + (state.rows.indexOf(r) + 1) + "</td><td>" + POOL_NAME[r.pool] + "</td><td>" + r.prize + "</td><td class='num'>" + fmt(r.quota) + "</td><td class='num'>" + luckyText(r) + "</td><td class='num'>" + fmt(r.matched) + "</td><td><span class='adm-status draw-st--" + r.status + "'>" + STATUS[r.status] + "</span></td><td class='muted nowrap'>" + r.time + "</td><td><span class='adm-table__op'>" + ops + "</span></td></tr>";
    }).join("");
    var pages = Math.max(1, Math.ceil(state.all.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    $("#pager").innerHTML = '<span class="adm-pager__total">共 ' + state.all.length + ' 条</span>' +
      '<button type="button" ' + (state.page <= 1 ? "disabled" : "") + ' data-page="' + (state.page - 1) + '">‹</button>' +
      Array.from({ length: pages }, function (_, i) { return i + 1; }).map(function (n) { return '<button type="button" class="' + (n === state.page ? "is-active" : "") + '" data-page="' + n + '">' + n + "</button>"; }).join("") +
      '<button type="button" ' + (state.page >= pages ? "disabled" : "") + ' data-page="' + (state.page + 1) + '">›</button>';
    bind();
  }

  function bind() {
    $$("[data-page]").forEach(function (b) { b.onclick = function () { state.page = Number(b.getAttribute("data-page")); render(); }; });
    $$("[data-act]").forEach(function (b) {
      var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
      b.onclick = function () {
        if (act === "edit") openAdd(id);
        if (act === "publish") openPublish(id);
        if (act === "view") openView(id);
      };
    });
  }
  function find(id) { return state.rows.find(function (r) { return r.id === id; }); }
  function openModal(id) { var m = document.getElementById(id); m.classList.add("is-open"); m.setAttribute("aria-hidden", "false"); }
  function closeModal(m) { m.classList.remove("is-open"); m.setAttribute("aria-hidden", "true"); }
  $$("[data-close]").forEach(function (b) { b.onclick = function () { closeModal(b.closest(".adm-modal")); }; });

  function fillPrizeOptions() {
    $("#r-prize").innerHTML = PRIZES[state.pool].map(function (p) {
      return '<option value="' + p.key + '">' + p.name + '（中奖数量 ' + p.quota + '）</option>';
    }).join("");
  }
  function selectedPrize() { return PRIZES[state.pool].find(function (p) { return p.key === $("#r-prize").value; }); }

  function renderNumInputs(prefill) {
    var p = selectedPrize();
    var box = $("#r-nums");
    box.innerHTML = "";
    $("#err-num").textContent = "";
    $("#item-num").classList.remove("is-error");
    $("#item-num").classList.remove("is-partial");
    if (!p) { $("#r-quota").value = ""; return; }
    if (p.digits === 1) {
      $("#r-quota").value = "1,500（末位匹配）";
      var one = document.createElement("input");
      one.className = "adm-input";
      one.id = "r-num-0";
      one.setAttribute("inputmode", "numeric");
      one.setAttribute("maxlength", "1");
      one.placeholder = "请输入末位 0–9";
      one.value = prefill && prefill[0] ? prefill[0] : "";
      box.appendChild(one);
      $("#num-tip").textContent = "参与奖按末位 1 位匹配，中奖数量 1,500 名；同一 CIF 只保留 1 个。";
    } else {
      $("#r-quota").value = fmt(p.quota) + " 个";
      for (var i = 0; i < p.quota; i++) {
        var inp = document.createElement("input");
        inp.className = "adm-input";
        inp.id = "r-num-" + i;
        inp.setAttribute("inputmode", "numeric");
        inp.setAttribute("maxlength", "5");
        inp.placeholder = "幸运数字 " + (i + 1) + "（00001–20000）";
        inp.value = prefill && prefill[i] ? prefill[i] : "";

        box.appendChild(inp);
      }
      $("#num-tip").textContent = "中奖数量 " + p.quota + " 个，请填写 " + p.quota + " 个 5 位全匹配幸运数字。";
    }
  }

  function readNums() {
    return $$("#r-nums input").map(function (i) { return i.value.trim(); });
  }
  function markError(msg) {
    $("#err-num").textContent = msg;
    $("#item-num").classList.add("is-error");
  }
  function clearError() { $("#err-num").textContent = ""; $("#item-num").classList.remove("is-error"); $("#item-num").classList.remove("is-partial"); }

  function validateAndMatch(pool, prize, nums) {
    clearError();
    var checks = [], rows = [];
    if (prize.digits === 1) {
      if (!/^\d$/.test(nums[0])) { markError("请输入末位 0–9 的一位数字"); return null; }
      var matches = CARD_POOL[pool].filter(function (c) { return c.slice(-1) === nums[0]; });
      checks.push({ num: nums[0], card: matches[0] || null, count: matches.length });
      rows = matches.length ? buildRows(1500, pool) : [];
      state.match = { pool: pool, prize: prize, nums: nums, checks: checks, rows: rows, valid: matches.length > 0, count: rows.length };
    } else {
      for (var i = 0; i < nums.length; i++) {
        if (!/^\d{5}$/.test(nums[i]) || parseInt(nums[i], 10) < 1) { markError("幸运数字 " + (i + 1) + " 需为 00001–20000 的 5 位数字"); return null; }
      }
      if (new Set(nums).size !== nums.length) { markError("幸运数字不能重复"); return null; }
      for (var j = 0; j < nums.length; j++) {
        var card = CARD_POOL[pool].find(function (c) { return c === nums[j]; });
        checks.push({ num: nums[j], card: card || null });
        if (card) rows.push(cardRow(card, pool));
      }
      state.match = { pool: pool, prize: prize, nums: nums, checks: checks, rows: rows, valid: checks.every(function (c) { return !!c.card; }), count: rows.length };
    }
    state.matchPage = 1; state.matchSize = 10;
    return state.match;
  }

  function renderChecks(m) {
    var box = $("#num-checks");
    box.innerHTML = m.checks.map(function (c, i) {
      var ok = !!c.card;
      return '<div class="draw-check ' + (ok ? "" : "is-bad") + '">' +
        '<span class="draw-check__no">号码 ' + (i + 1) + '</span>' +
        '<span class="draw-check__num">' + (m.prize.digits === 1 ? "末位 " + c.num : c.num) + '</span>' +
        '<span class="draw-check__result">' + (ok ? "匹配福卡 " + c.card : "未匹配，请重新抽奖") + '</span>' +
        '<span class="draw-check__tag">' + (ok ? "已匹配" : "未匹配") + '</span>' +
        '</div>';
    }).join("");
  }

  function cardRow(card, pool) {
    var seed = parseInt(card, 10);
    return { account: "ES0" + (1 + seed % 3), card: card, cif: "1000" + String(1600 + seed % 800).slice(-4) + "A" + seed % 10, sales: String(5000 + seed % 40), phone: "6" + String(seed * 137).padStart(8, "0").slice(0, 8), invoice: "ES2500" + String(1000 + seed % 900).slice(-4) };
  }
  function buildRows(n, pool) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(cardRow(String(3000 + i).padStart(5, "0"), pool));
    return a;
  }

  function openAdd(id, restore) {
    state.editId = id || null;
    var r = id ? find(id) : null;
    if (r) state.pool = r.pool;
    state.pool = state.pool || "m12";
    $("#r-pool").value = state.pool;
    $("#r-pool").dispatchEvent(new Event("change", { bubbles: true }));
    var prizeKey = restore && restore.prizeKey ? restore.prizeKey : (r ? (prizeOf(state.pool, r.prize) || PRIZES[state.pool][0]).key : PRIZES[state.pool][0].key);
    $("#r-prize").value = prizeKey;
    $("#r-prize").dispatchEvent(new Event("change", { bubbles: true }));
    renderNumInputs(restore ? restore.nums : (r ? (r.luckies || [r.lucky]) : []));
    // 返回录入页只保留上一次填写内容；不标红、不提示，由用户自行修改。
    $("#modal-result-title").textContent = id ? "编辑抽奖结果 · " + id : "添加抽奖结果";
    $("#num-checks").innerHTML = "";
    openModal("modal-result");
  }

  $("#r-pool").onchange = function () { state.pool = this.value; fillPrizeOptions(); renderNumInputs([]); };
  $("#r-prize").onchange = function () { renderNumInputs([]); };
  $("#f-pool").onchange = function () { state.pool = this.value; state.all = state.rows.filter(function (r) { return r.pool === state.pool; }); state.page = 1; render(); };
  $("#btn-add").onclick = function () { openAdd(); };

  $("#btn-confirm").onclick = function () {
    var p = selectedPrize();
    if (!p) { markError("请选择奖品"); return; }
    var nums = readNums();
    var m = validateAndMatch(state.pool, p, nums);
    if (!m) return;
    state.lastNums = nums.slice();
    state.lastInvalid = m.checks.map(function (c, i) { return c.card ? -1 : i; }).filter(function (i) { return i >= 0; });
    state.lastPrize = p.key;
    closeModal(document.getElementById("modal-result"));
    $("#btn-match-close").style.display = "none";
    $("#btn-regenerate").style.display = "";
    $("#btn-regenerate").textContent = m.valid ? "重新生成" : "重新抽奖";
    $("#btn-save-result").style.display = m.valid ? "" : "none";
    $("#modal-match-title").textContent = m.valid ? "抽奖结果" : "号码匹配校验";
    renderChecks(m);
    $("#match-summary").innerHTML = "奖池：<b>" + POOL_NAME[m.pool] + "</b>　奖品：<b>" + m.prize.name + "</b>　中奖数量：<b>" + fmt(m.prize.quota) + "</b>　号码校验：<b>" + m.checks.filter(function (c) { return !!c.card; }).length + " / " + m.checks.length + " 匹配</b>" + (m.valid ? "" : "　<span style='color:#cf1322'>存在未匹配号码，请重新抽奖</span>");
    renderMatch(); openModal("modal-match");
  };

  function renderMatch() {
    var m = state.match, total = m.rows.length;
    var pages = Math.max(1, Math.ceil(total / state.matchSize));
    if (state.matchPage > pages) state.matchPage = pages;
    var start = (state.matchPage - 1) * state.matchSize;
    $("#match-rows").innerHTML = m.rows.slice(start, start + state.matchSize).map(function (r) {
      return "<tr><td>" + r.account + "</td><td class='num'>" + r.card + "</td><td class='num'>" + r.cif + "</td><td class='num'>" + r.sales + "</td><td class='num'>" + r.phone + "</td><td class='num'>" + r.invoice + "</td></tr>";
    }).join("");
    $("#match-total").textContent = "共 " + fmt(total) + " 条";
    $("#match-page-btns").innerHTML = Array.from({ length: Math.min(5, pages) }, function (_, i) { return i + 1; }).map(function (n) { return '<button type="button" class="' + (n === state.matchPage ? "is-active" : "") + '" data-mpage="' + n + '">' + n + "</button>"; }).join("");
    $$("[data-mpage]").forEach(function (b) { b.onclick = function () { state.matchPage = Number(b.getAttribute("data-mpage")); renderMatch(); }; });
    $("#match-prev").onclick = function () { if (state.matchPage > 1) { state.matchPage--; renderMatch(); } };
    $("#match-next").onclick = function () { if (state.matchPage < pages) { state.matchPage++; renderMatch(); } };
    $("#match-size").onchange = function () { state.matchSize = parseInt(this.value, 10) || 10; state.matchPage = 1; renderMatch(); };
  }
  $("#btn-regenerate").onclick = function () {
    var restore = { nums: (state.lastNums || []).slice(), invalid: (state.lastInvalid || []).slice(), prizeKey: state.lastPrize };
    closeModal(document.getElementById("modal-match"));
    openAdd(state.editId, restore);
  };
  $("#btn-save-result").onclick = function () {
    var m = state.match;
    if (!m || !m.valid) { U.toast("存在未匹配号码，请重新抽奖"); return; }
    var row = { id: state.editId || ("B-" + Date.now().toString().slice(-6)), pool: m.pool, prize: m.prize.name, quota: m.prize.quota, luckies: m.nums.slice(), matched: m.rows.length, matchRows: m.rows.slice(), status: "pending", time: "2027-02-26 21:00" };
    if (state.editId) {
      var idx = state.rows.findIndex(function (x) { return x.id === state.editId; });
      if (idx >= 0) state.rows[idx] = row;
    } else state.rows.unshift(row);
    state.all = state.rows.filter(function (r) { return r.pool === state.pool; });
    state.page = 1;
    closeModal(document.getElementById("modal-match")); render(); U.toast("已生成抽奖结果，状态为待发布");
  };

  function openView(id) {
    var r = find(id);
    var p = prizeOf(r.pool, r.prize) || { digits: 5, quota: r.quota };
    var rows = r.matchRows ? r.matchRows.slice() : (p.digits === 1 ? buildRows(1500, r.pool) : (r.luckies || []).map(function (n) { return cardRow(n, r.pool); }).filter(Boolean));
    var checks = (r.luckies || []).map(function (n) { return { num: n, card: (p.digits === 1 ? rows[0] && rows[0].card : n) }; });
    state.match = { pool: r.pool, prize: p, nums: r.luckies || [], checks: checks, rows: rows, valid: true, count: rows.length };
    state.matchPage = 1; state.matchSize = 10;
    $("#btn-match-close").style.display = "";
    $("#btn-regenerate").style.display = "none";
    $("#btn-save-result").style.display = "none";
    $("#modal-match-title").textContent = "抽奖详情（只读）";
    renderChecks(state.match);
    $("#match-summary").innerHTML = "奖池：<b>" + POOL_NAME[r.pool] + "</b>　奖品：<b>" + r.prize + "</b>　中奖数量：<b>" + fmt(r.quota) + "</b>　号码校验：<b>" + checks.length + " / " + checks.length + " 匹配</b>　匹配记录：<b>" + fmt(rows.length) + "</b> 条　状态：<b>" + STATUS[r.status] + "</b>";
    renderMatch();
    openModal("modal-match");
  }

  function openPublish(id) {
    var r = find(id); state.publishId = id;
    $("#publish-summary").innerHTML = "序号：<b>" + (state.rows.indexOf(r) + 1) + "</b>　奖池：<b>" + POOL_NAME[r.pool] + "</b>　奖品：<b>" + r.prize + "</b>　中奖数量：<b>" + fmt(r.quota) + "</b>　匹配：<b>" + fmt(r.matched) + "</b> 条<br><span style='color:#cf1322'>发布后无法进行修改，请确认是否发布。</span>";
    openModal("modal-publish");
  }
  $("#btn-publish-ok").onclick = function () {
    var r = find(state.publishId); if (r) { r.status = "published"; r.time = "2027-03-01 10:00"; }
    closeModal(document.getElementById("modal-publish")); render(); U.toast("已发布：已同步 H5 福卡状态与中奖公示");
  };
  $("#btn-search").onclick = function () {
    var pool = $("#f-pool").value, st = $("#f-status").value;
    state.all = state.rows.filter(function (r) { return r.pool === pool && (!st || r.status === st); });
    state.page = 1; render();
  };
  $("#btn-reset").onclick = function () { $("#filters").reset(); state.pool = "m12"; state.all = state.rows.filter(function (r) { return r.pool === "m12"; }); state.page = 1; render(); };
  $("#btn-export").onclick = function () { U.toast("导出抽奖结果（演示）"); };

  window.DEMOS = [
    { label: "12 月一等奖录入", fn: function () { state.pool = "m12"; openAdd(); } },
    { label: "12 月三等奖（2 个号码）", fn: function () { state.pool = "m12"; openAdd(); $("#r-prize").value = "m12-3"; $("#r-prize").dispatchEvent(new Event("change", { bubbles: true })); } },
    { label: "终极一等奖（Tesla）", fn: function () { state.pool = "ultimate"; openAdd(); } },
    { label: "参与奖（末位匹配）", fn: function () { state.pool = "ultimate"; openAdd(); $("#r-prize").value = "u-p"; $("#r-prize").dispatchEvent(new Event("change", { bubbles: true })); } }
  ];
  render();
})();
</script>
</body>
</html>
