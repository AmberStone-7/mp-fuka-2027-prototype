<script>
  window.PAGE_META = {

  window.DEMOS = [

<script src="../assets/js/legacy.js"></script>
<script>
(function () {
  var POOLS = [
    { name: "12 月月度奖池", period: "2026-12-01 — 2026-12-31", cards: 3120, prizes: "4 档（月度）", status: "已配置 · 待开奖", pool: "m12" },
    { name: "1 月月度奖池", period: "2027-01-01 — 2027-01-31", cards: 2870, prizes: "4 档（月度）", status: "已配置 · 待开奖", pool: "m1" },
    { name: "2 月月度奖池", period: "2027-02-01 — 2027-02-28", cards: 2430, prizes: "4 档（月度）", status: "已配置 · 待开奖", pool: "m2" },
    { name: "终极大奖池", period: "2026-12-01 — 2027-02-28", cards: 8420, prizes: "Tesla 1 + 参与奖 1,500", status: "待 2 月月度开奖后生成快照", pool: "ultimate" }
  ];
  document.getElementById("rows").innerHTML = POOLS.map(function (p) {
    return "<tr><td><b>" + p.name + "</b></td><td class='muted nowrap'>" + p.period + "</td>" +
      "<td class='num'>" + p.cards.toLocaleString() + "</td><td>" + p.prizes + "</td>" +
      "<td><span class='adm-status adm-status--pending'>" + p.status + "</span></td>" +
      "<td><span class='adm-table__op'><button type='button' data-prizes='" + p.pool + "'>配置奖品</button><button type='button' data-draw='" + p.pool + "'>开奖</button></span></td></tr>";
  }).join("");
  U.$$("[data-prizes]").forEach(function (b) { b.onclick = function () { location.href = "prizes.html?pool=" + b.getAttribute("data-prizes"); }; });
  U.$$("[data-draw]").forEach(function (b) { b.onclick = function () { location.href = "draw.html?pool=" + b.getAttribute("data-draw"); }; });
  document.getElementById("btn-export").onclick = function () { U.toast("导出奖池清单（演示）"); };
})();
</script>
