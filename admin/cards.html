<main class="adm-main">
  <div class="adm-topbar"><span class="adm-avatar">A</span></div>

  <div class="adm-crumb">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
    <span>/</span>
    <b>福卡管理</b>
  </div>

  <form class="adm-filters" id="filters" onsubmit="return false">
    <div class="adm-field">
      <label for="f-no">福卡编号</label>
      <input class="adm-input" id="f-no" placeholder="请输入福卡编号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-cust">客户号</label>
      <input class="adm-input" id="f-cust" placeholder="请输入客户号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-tax">税号 / CIF</label>
      <input class="adm-input" id="f-tax" placeholder="请输入税号 / CIF" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-sales">业务员号</label>
      <input class="adm-input" id="f-sales" placeholder="请输入业务员号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-invoice">发票号</label>
      <input class="adm-input" id="f-invoice" placeholder="请输入发票号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-source">福卡类型</label>
      <select class="adm-select" id="f-source">
        <option value="">全部类型</option>
        <option value="order">订单福卡</option>
        <option value="new">新客福卡</option>
        <option value="invite">邀请福卡</option>
        <option value="official">官方福卡</option>
        <option value="cumulative">累计满额福卡</option>
      </select>
    </div>
    <div class="adm-field">
      <label for="f-pool">所属奖池</label>
      <select class="adm-select" id="f-pool">
        <option value="">全部奖池</option>
        <option value="12 月奖池">12 月奖池</option>
        <option value="1 月奖池">1 月奖池</option>
        <option value="2 月奖池">2 月奖池</option>
        <option value="终极大奖池">终极大奖池</option>
      </select>
    </div>
    <div class="adm-field">
      <label for="f-status">状态</label>
      <select class="adm-select" id="f-status">
        <option value="">全部状态</option>
        <option value="pending">待开奖</option>
        <option value="won">已中奖</option>
        <option value="lost">未中奖</option>
        <option value="invalid">已失效</option>
      </select>
    </div>
    <div class="adm-field">
      <label for="f-start">发放时间</label>
      <span class="adm-daterange">
        <input class="adm-input" id="f-start" placeholder="开始日期">
        <span>→</span>
        <input class="adm-input" id="f-end" placeholder="结束日期">
      </span>
    </div>
    <div class="adm-filters__btns">
      <button class="adm-btn adm-btn--primary" id="btn-search" type="button">查 询</button>
      <button class="adm-btn" id="btn-reset" type="button">重 置</button>
    </div>
  </form>

  <div class="adm-actions">
    <button class="adm-btn" id="btn-export" type="button">导 出</button>
    <button class="adm-btn" id="btn-batch-void" type="button">批量失效</button>
    <button class="adm-btn adm-btn--primary adm-btn__right" id="btn-add" type="button" style="margin-left:auto">添加福卡</button>

  <div class="adm-table-wrap">

          <th>税号 / CIF</th>
          <th>福卡类型</th>

          <th>客户手机号</th>
          <th>业务员号</th>
          <th>绑定发票</th>
          <th>发票金额（不含税）</th>
          <th>发票创建时间</th>
          <th>状态</th>
          <th>备注</th>
          <th>发放时间</th>
          <th>最近修改时间</th>
          <th>操作</th>
        </tr>

<!-- 添加福卡 -->
<div class="adm-modal" id="modal-add" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
    <div class="adm-modal__head">
      <span class="adm-modal__title" id="modal-add-title">创建幸运福卡</span>
      <button class="adm-modal__close" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="adm-modal__body">
      <div class="adm-form-item">
        <label class="required" for="add-account">账套</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="add-account">
            <option value="">请选择账套</option>
            <option>ES01</option>
            <option>ES02</option>
            <option>ES03</option>
          </select>
          <p class="adm-form-item__err">请选择账套</p>
        </div>
      </div>
      <div class="adm-form-item">
        <label class="required" for="add-cif">客户号</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="add-cif" placeholder="请输入客户号">
          <p class="adm-form-item__err">请输入客户号</p>
        </div>
      </div>
      <div class="adm-form-item">
        <label class="required" for="add-invoice">发票号</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="add-invoice" placeholder="请输入发票号">
          <p class="adm-form-item__err">请输入发票号</p>
        </div>
      </div>
      <div class="adm-form-item">
        <label class="required" for="add-count">福卡数量</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="add-count" value="1" inputmode="numeric">
          <p class="adm-form-item__err">请输入大于 0 的整数</p>
        </div>
      </div>
      <p class="adm-form-tip">仅管理员可手动补录，需填写原因并留审计（本期用数据库操作，界面为后续版本）。</p>
    </div>
    <div class="adm-modal__foot">
      <button class="adm-btn" type="button" data-close>取 消</button>
      <button class="adm-btn adm-btn--primary" type="button" id="btn-add-ok">确 定</button>
    </div>
  </div>
</div>

<!-- 失效 -->
<div class="adm-modal" id="modal-void" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-void-title">
    <div class="adm-modal__head">
      <span class="adm-modal__title" id="modal-void-title">福卡失效</span>
      <button class="adm-modal__close" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="adm-modal__body">
      <div class="adm-form-item">
        <label>福卡编号</label>
        <div class="adm-form-item__ctrl"><input class="adm-input" id="void-no" readonly></div>
      </div>
      <div class="adm-form-item">
        <label class="required" for="void-reason">失效原因</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="void-reason">
            <option value="">请选择原因</option>
            <option>退单</option>
            <option>红冲 / 取消</option>
            <option>手工纠错</option>
            <option>其他</option>
          </select>
          <p class="adm-form-item__err">请选择失效原因</p>
        </div>
      </div>
      <div class="adm-form-item">
        <label for="void-note">备注</label>
        <div class="adm-form-item__ctrl"><input class="adm-input" id="void-note" placeholder="选填，例如退单号"></div>
      </div>
      <p class="adm-form-tip">失效后号码不回收；已中奖福卡失效将触发候补（本期由人工处理）。</p>
    </div>
    <div class="adm-modal__foot">
      <button class="adm-btn" type="button" data-close>取 消</button>
      <button class="adm-btn adm-btn--danger" type="button" id="btn-void-ok">确 定</button>
    </div>
  </div>
</div>

          var st = r.status;
          return "<tr>" +
            '<td class="col-check"><input type="checkbox" data-check="' + r.no + '"' + (state.checked[r.no] ? " checked" : "") + "></td>" +
            '<td class="num">' + r.no + "</td>" +
            '<td class="num">' + r.account + "</td>" +
            '<td class="num">' + r.custNo + "</td>" +
            '<td class="num">' + r.taxId + "</td>" +
            '<td><span class="adm-source adm-source--' + r.source + '">' + SOURCE[r.source] + "</span></td>" +
            '<td>' + poolOf(r) + "</td>" +
            '<td class="num">' + r.phone + "</td>" +
            '<td class="num">' + r.sales + "</td>" +
            '<td class="num">' + (r.invoice || "—") + "</td>" +
            '<td class="num">' + (r.amount ? r.amount + " €" : "—") + "</td>" +
            '<td class="nowrap muted">' + (r.created || "—") + "</td>" +
            '<td><span class="adm-status adm-status--' + st + '">' + STATUS[st] + "</span></td>" +
            '<td class="muted">' + r.note + "</td>" +
            '<td class="nowrap muted">' + r.time + "</td>" +
            '<td class="nowrap muted">' + r.modified + "</td>" +
            '<td><span class="adm-table__op">' +
            (st === "invalid" ? '<button type="button" data-restore="' + r.no + '">恢复</button>' : '<button type="button" data-void="' + r.no + '">失效</button>') +
            '<button type="button" data-detail="' + r.no + '">详情</button>' +
            "</span></td>" +
            "</tr>";
        }).join("");
      }
      $("#pager-total").textContent = "共 " + (state.filtered ? state.rows.length : "8,420") + " 条";
      bindRowActions();
    }

    function bindRowActions() {
      U.$$("[data-void]").forEach(function (b) {
        b.onclick = function () { openVoid(b.getAttribute("data-void")); };
      });
      U.$$("[data-restore]").forEach(function (b) {
        b.onclick = function () {
          var no = b.getAttribute("data-restore");
          var r = state.rows.find(function (x) { return x.no === no; });
          if (r) r.status = "pending";
          render();
          U.toast("已恢复为待开奖（管理员操作，需留痕）");
        };
      });
      U.$$("[data-detail]").forEach(function (b) {
        b.onclick = function () {
          U.toast("福卡详情（号池占用 / 发票 / 邮件记录）在批量阶段提供");
        };
      });
      U.$$("[data-check]").forEach(function (c) {
        c.onchange = function () { state.checked[c.getAttribute("data-check")] = c.checked; };
      });
    }

    function filter() {
      var no = $("#f-no").value.trim();
      var cust = $("#f-cust").value.trim();
      var tax = $("#f-tax").value.trim();
      var inv = $("#f-invoice").value.trim();
      var sales = $("#f-sales").value.trim();
      var src = $("#f-source").value;
      var pool = $("#f-pool").value;
      var st = $("#f-status").value;
      state.rows = ROWS.filter(function (r) {
        return (!no || r.no.indexOf(no) === 0) &&
          (!cust || r.custNo.indexOf(cust) >= 0) &&
          (!tax || r.taxId.toLowerCase().indexOf(tax.toLowerCase()) >= 0) &&
          (!inv || (r.invoice || "").indexOf(inv) >= 0) && (!sales || r.sales.indexOf(sales) >= 0) &&
          (!src || r.source === src) &&
          (!pool || poolOf(r) === pool) &&
          (!st || r.status === st);
      });
      state.filtered = true;
      render();
      U.toast("查询完成，共 " + state.rows.length + " 条（演示数据）");
    }

    function reset() {
      $("#filters").reset();
      state.rows = ROWS.slice();
      state.filtered = false;
      render();
      U.toast("已重置");
    }

    function emptyState() {
      state.rows = [];
      state.filtered = true;
      render();
    }

    function openModal(id) {
      var m = document.getElementById(id);
      m.classList.add("is-open");
      m.setAttribute("aria-hidden", "false");
    }
    function closeModal(m) {
      m.classList.remove("is-open");
      m.setAttribute("aria-hidden", "true");
    }

    function openVoid(no) {
      state.voidNo = no;
      $("#void-no").value = no;
      $("#void-reason").value = "";
      $("#void-note").value = "";
      U.$$("#modal-void .adm-form-item").forEach(function (f) { f.classList.remove("is-error"); });
      openModal("modal-void");
    }

    $("#btn-search").addEventListener("click", filter);
    $("#btn-reset").addEventListener("click", reset);
    $("#btn-export").addEventListener("click", function () { U.toast("已导出当前筛选结果（演示）"); });
    $("#btn-add").addEventListener("click", function () { openModal("modal-add"); });
    $("#btn-batch-void").addEventListener("click", function () {
      var n = Object.keys(state.checked).filter(function (k) { return state.checked[k]; }).length;
      if (!n) { U.toast("请先勾选需要失效的福卡"); return; }
      U.toast("已提交 " + n + " 张福卡失效（演示，需填原因并留审计）");
    });
    $("#btn-add-ok").addEventListener("click", function () {
      var ok = true;
      [["add-account", ""], ["add-cif", ""], ["add-invoice", ""], ["add-count", ""]].forEach(function (pair) {
        var el = document.getElementById(pair[0]);
        var item = el.closest(".adm-form-item");
        if (!el.value.trim()) { item.classList.add("is-error"); ok = false; }
        else item.classList.remove("is-error");
      });
      var cnt = parseInt($("#add-count").value, 10);
      if (!cnt || cnt < 1) { $("#add-count").closest(".adm-form-item").classList.add("is-error"); ok = false; }
      if (!ok) return;
      closeModal($("#modal-add"));
      U.toast("已创建福卡（演示）");
    });
    $("#btn-void-ok").addEventListener("click", function () {
      var reason = $("#void-reason");
      if (!reason.value) {
        reason.closest(".adm-form-item").classList.add("is-error");
        return;
      }
      var r = state.rows.find(function (x) { return x.no === state.voidNo; });
      if (r) r.status = "invalid";
      var target = ROWS.find(function (x) { return x.no === state.voidNo; });
      if (target) target.status = "invalid";
      closeModal($("#modal-void"));
      render();
      U.toast("福卡 " + state.voidNo + " 已失效（原因：" + reason.value + "，演示）");
    });

    U.$$("[data-close]").forEach(function (b) {
      b.addEventListener("click", function () { closeModal(b.closest(".adm-modal")); });
    });
    document.getElementById("check-all").addEventListener("change", function () {
      var on = this.checked;
      U.$$("[data-check]").forEach(function (c) { c.checked = on; state.checked[c.getAttribute("data-check")] = on; });
    });

    U.$$("[data-todo]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        U.toast("样例阶段：该模块在批量阶段提供");
      });
    });

    window.DEMOS = [
      { label: "打开添加福卡", fn: function () { openModal("modal-add"); } },
      { label: "打开失效弹窗", fn: function () { openVoid(ROWS[0].no); } },
      { label: "筛选空态", fn: function () { emptyState(); } }
    ];

    render();
  })();
</script>
</body>
</html>
