<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邀请码管理 · 抽奖后台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <style>
    .inv-usage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .inv-usage-table th, .inv-usage-table td { padding: 9px 8px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
    .inv-usage-table th { background: #fafafa; font-weight: 600; color: #595959; }
    .inv-usage-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
    .inv-usage-head .muted { color: #8c8c8c; font-size: 12.5px; }
    .inv-usage-pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 12px; font-size: 13px; color: #595959; }
    .inv-usage-pager button { min-width: 28px; height: 28px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; }
    .inv-usage-pager button.is-active { border-color: #1677ff; color: #1677ff; }
    .inv-usage-pager select { height: 28px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; }
    .inv-code { font-family: Menlo, monospace; font-weight: 600; color: #262626; }
    .inv-mono { font-family: Menlo, monospace; }
  </style>
</head>
<body class="adm">

<aside class="adm-sider">
  <div class="adm-logo">抽奖后台管理</div>
  <nav class="adm-menu" aria-label="后台菜单">
    <a class="adm-menu__item" href="cards.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M8 15h4"/></svg>
      福卡管理
    </a>
    <a class="adm-menu__item is-active" href="invite.html">
      <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-6l3-3a4 4 0 0 1 6 6l-2 2"/><path d="M14 10a4 4 0 0 1 0 6l-3 3a4 4 0 0 1-6-6l2-2"/></svg>
      邀请码管理
    </a>
    <a class="adm-menu__item" href="pools.html">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v4H4z"/><path d="M6 11v8h12v-8"/><path d="M9 7V5h6v2"/></svg>
      奖池管理
    </a>
    <a class="adm-menu__item" href="draw.html">
      <svg viewBox="0 0 24 24"><path d="M5 10v4l9 4V6L5 10z"/><path d="M14 9a3.5 3.5 0 0 1 0 6"/><path d="M7 14v4"/></svg>
      抽奖管理
    </a>
    <a class="adm-menu__item" href="prizes.html">
      <svg viewBox="0 0 24 24"><path d="M4 11h16v9H4z"/><path d="M3 7h18v4H3z"/><path d="M12 7v13"/></svg>
      奖品管理
    </a>
    <a class="adm-menu__item" href="winners.html">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>

    </a>
    <a class="adm-menu__item" href="email.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 8l9 6 9-6"/></svg>
      邮件日志
    </a>
  </nav>
  <button class="adm-sider__collapse" type="button" title="收起菜单">‹</button>
</aside>

<main class="adm-main">
  <div class="adm-topbar"><span class="adm-avatar">A</span></div>

  <div class="adm-crumb">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
    <span>/</span>
    <b>邀请码管理</b>
  </div>

  <form class="adm-filters" id="filters" onsubmit="return false">
    <div class="adm-field">
      <label for="f-code">邀请码</label>
      <input class="adm-input" id="f-code" placeholder="请输入邀请码" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-cust">客户号</label>
      <input class="adm-input" id="f-cust" placeholder="请输入客户号" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-tax">税号 / CIF</label>
      <input class="adm-input" id="f-tax" placeholder="请输入税号 / CIF" autocomplete="off">
    </div>
    <div class="adm-field">
      <label for="f-type">码类型</label>
      <select class="adm-select" id="f-type">
        <option value="">全部类型</option>
        <option value="normal">普通码</option>
        <option value="official">官方码</option>
      </select>
    </div>
    <div class="adm-field">
      <label for="f-status">状态</label>
      <select class="adm-select" id="f-status">
        <option value="">全部状态</option>
        <option value="active">生效中</option>
        <option value="exhausted">已用满</option>
        <option value="disabled">已停用</option>
      </select>
    </div>
    <div class="adm-filters__btns">
      <button class="adm-btn adm-btn--primary" id="btn-search" type="button">查 询</button>
      <button class="adm-btn" id="btn-reset" type="button">重 置</button>
    </div>
  </form>

  <div class="adm-actions">
    <button class="adm-btn" id="btn-export" type="button">导 出</button>
    <button class="adm-btn adm-btn--primary" id="btn-official" type="button" style="margin-left:auto">生成官方邀请码</button>
  </div>

  <div class="adm-table-wrap">
    <table class="adm-table">
      <thead>
        <tr>
          <th>邀请码</th>
          <th>客户号</th>
          <th>税号 / CIF</th>
          <th>码类型</th>
          <th>已用 / 上限</th>
          <th>状态</th>
          <th>生成时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="adm-pager" id="pager"></div>
</main>

<!-- 编辑邀请码 -->
<div class="adm-modal" id="modal-edit" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title">
    <div class="adm-modal__head">
      <span class="adm-modal__title" id="modal-edit-title">编辑邀请码</span>
      <button class="adm-modal__close" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="adm-modal__body">
      <div class="adm-form-item">
        <label>邀请码</label>
        <div class="adm-form-item__ctrl"><input class="adm-input inv-mono" id="edit-code" readonly></div>
      </div>
      <div class="adm-form-item">
        <label for="edit-status">状态</label>
        <div class="adm-form-item__ctrl">
          <select class="adm-select" id="edit-status">
            <option value="active">生效中</option>
            <option value="disabled">已停用</option>
          </select>
        </div>
      </div>
      <div class="adm-form-item" id="edit-cap-item">
        <label for="edit-cap">单码上限</label>
        <div class="adm-form-item__ctrl">
          <input class="adm-input" id="edit-cap" inputmode="numeric" placeholder="最多 100">
          <p class="adm-form-item__err" id="edit-cap-err">上限为 1–100，且不能低于已使用数量</p>
        </div>
      </div>
      <p class="adm-form-tip">停用后该码不可再被领取；恢复后继续生效。上调上限后已用满的码自动恢复生效。</p>
    </div>
    <div class="adm-modal__foot">
      <button class="adm-btn" type="button" data-close>取 消</button>
      <button class="adm-btn adm-btn--primary" type="button" id="btn-edit-save">保 存</button>
    </div>
  </div>
</div>

<!-- 使用记录 -->
<div class="adm-modal" id="modal-usage" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box adm-modal__box--wide" role="dialog" aria-modal="true" aria-labelledby="modal-usage-title">
    <div class="adm-modal__head">
      <span class="adm-modal__title" id="modal-usage-title">使用记录</span>
      <button class="adm-modal__close" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="adm-modal__body">
      <div class="inv-usage-head">
        <span class="muted" id="usage-tip">同一被邀请人仅可绑定一个邀请人</span>
        <span class="muted" id="usage-count"></span>
      </div>
      <div style="max-height:420px;overflow:auto">
        <table class="inv-usage-table">
          <thead>
            <tr><th>被邀请客户 CIF</th><th>客户名称</th><th>绑定时间</th><th>绑定状态</th><th>匹配发票</th><th>发放福卡</th></tr>
          </thead>
          <tbody id="usage-rows"></tbody>
        </table>
      </div>
      <div class="inv-usage-pager">
        <span id="usage-total"></span>
        <button type="button" id="usage-prev">‹</button>
        <span id="usage-page-btns" style="display:flex;gap:6px"></span>
        <button type="button" id="usage-next">›</button>
        <select id="usage-size" aria-label="每页条数">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50">50 条/页</option>
        </select>
      </div>
    </div>
    <div class="adm-modal__foot">
      <button class="adm-btn" type="button" data-close>关 闭</button>
    </div>
  </div>
</div>

<!-- 生成官方码确认 -->
<div class="adm-modal" id="modal-official" aria-hidden="true">
  <div class="adm-modal__mask" data-close></div>
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-official-title">
    <div class="adm-modal__head">
      <span class="adm-modal__title" id="modal-official-title">生成官方邀请码</span>
      <button class="adm-modal__close" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="adm-modal__body">
      <p style="margin:0;font-size:14px;line-height:1.8;color:#262626">官方邀请码仅生成一次，生成后不可修改或停用；每个 CIF 限领 1 张，使用记录可随时查看。</p>
      <p class="adm-form-tip" style="margin-top:10px">确认生成？</p>
    </div>
    <div class="adm-modal__foot">
      <button class="adm-btn" type="button" data-close>取 消</button>
      <button class="adm-btn adm-btn--primary" type="button" id="btn-official-ok">确认生成</button>
    </div>
  </div>
</div>

<script>

    title: "邀请码管理",

      "操作列仅保留「编辑 / 使用记录」；官方码只有「使用记录」。",
      "使用记录改为弹窗，不再使用页签与独立列表页。"

    todo: [
      "官方码使用记录量级约 2,000，需后端分页。",
      "普通码单码上限 100 为当前规则，是否可按客户调整待确认。"
    ]
  };

</script>
<script src="../assets/js/legacy.js"></script>
<script>
(function () {
  var $ = U.$, $$ = U.$$;
  var PAGE_SIZE = 10, currentPage = 1;

  var ROWS = [
    { code: "MP-OFFICIAL-2027", type: "official", custNo: "—", taxId: "—", used: 1238, limit: null, status: "active", created: "2026-11-20 10:00:00" },
    { code: "MP2027A8K3", type: "normal", custNo: "10009502", taxId: "B12345678", used: 12, limit: 100, status: "active", created: "2026-11-20 10:12:00" },
    { code: "MP2027B2C4", type: "normal", custNo: "10008496", taxId: "B12456321", used: 100, limit: 100, status: "exhausted", created: "2026-11-20 10:12:00" },
    { code: "MP2027C7D9", type: "normal", custNo: "10019544", taxId: "B12587496", used: 36, limit: 100, status: "disabled", created: "2026-11-20 10:13:00" },
    { code: "MP2027D1E5", type: "normal", custNo: "10013992", taxId: "B12698523", used: 0, limit: 100, status: "active", created: "2026-11-20 10:13:00" },
    { code: "MP2027E4F2", type: "normal", custNo: "10022871", taxId: "B12741258", used: 58, limit: 100, status: "active", created: "2026-11-20 10:14:00" },
    { code: "MP2027F9G6", type: "normal", custNo: "10031120", taxId: "B12852369", used: 21, limit: 100, status: "active", created: "2026-11-20 10:14:00" },
    { code: "MP2027H2J8", type: "normal", custNo: "10040771", taxId: "B12963470", used: 77, limit: 100, status: "active", created: "2026-11-20 10:15:00" },
    { code: "MP2027K5L1", type: "normal", custNo: "10055882", taxId: "B12074185", used: 5, limit: 100, status: "disabled", created: "2026-11-20 10:15:00" },
    { code: "MP2027M8N3", type: "normal", custNo: "10066993", taxId: "B12185296", used: 44, limit: 100, status: "active", created: "2026-11-20 10:16:00" },
    { code: "MP2027P1Q7", type: "normal", custNo: "10077104", taxId: "B12296307", used: 90, limit: 100, status: "active", created: "2026-11-20 10:16:00" },
    { code: "MP2027R4S2", type: "normal", custNo: "10088215", taxId: "B12529630", used: 16, limit: 100, status: "active", created: "2026-11-20 10:17:00" }
  ];

  var state = { rows: ROWS.slice(), page: 1, editing: null, usageCode: null, usagePage: 1, usageSize: 10 };

  var STATUS = { active: "生效中", exhausted: "已用满", disabled: "已停用" };
  var TYPE = { normal: "普通码", official: "官方码" };
  var BIND = { pending: "待达标", success: "已发放", expired: "已过期" };

  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function paged() {
    return state.rows.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
  }

  function render() {
    $("#rows").innerHTML = paged().map(function (r) {
      var op = r.type === "official"
        ? '<button type="button" data-usage="' + r.code + '">使用记录</button>'
        : '<button type="button" data-edit="' + r.code + '">编辑</button><button type="button" data-usage="' + r.code + '">使用记录</button>';
      return "<tr>" +
        '<td class="inv-code">' + r.code + "</td>" +
        "<td>" + (r.custNo || "—") + "</td>" +
        "<td>" + (r.taxId || "—") + "</td>" +
        "<td>" + TYPE[r.type] + "</td>" +
        '<td class="inv-mono">' + fmt(r.used) + " / " + (r.limit == null ? "不限" : fmt(r.limit)) + "</td>" +
        '<td><span class="adm-status adm-status--' + (r.status === "active" ? "pending" : r.status === "exhausted" ? "won" : "invalid") + '">' + STATUS[r.status] + "</span></td>" +
        '<td class="muted nowrap">' + r.created + "</td>" +
        '<td><span class="adm-table__op">' + op + "</span></td>" +
        "</tr>";
    }).join("");
    $("#pager").innerHTML =
      '<span class="adm-pager__total">共 ' + state.rows.length + " 条</span>" +
      '<button type="button" ' + (state.page === 1 ? "disabled" : "") + ' data-page="' + (state.page - 1) + '">‹</button>' +
      Array.from({ length: Math.min(5, Math.max(1, Math.ceil(state.rows.length / PAGE_SIZE))) }, function (_, i) {
        var n = i + 1;
        return '<button type="button" class="' + (n === state.page ? "is-active" : "") + '" data-page="' + n + '">' + n + "</button>";
      }).join("") +
      '<button type="button" ' + (state.page >= Math.ceil(state.rows.length / PAGE_SIZE) ? "disabled" : "") + ' data-page="' + (state.page + 1) + '">›</button>' +
      '<select aria-label="每页条数"><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select>';
    bind();
  }

  function bind() {
    $$("[data-page]").forEach(function (b) {
      b.onclick = function () { state.page = Number(b.getAttribute("data-page")); render(); };
    });
    $$("[data-edit]").forEach(function (b) { b.onclick = function () { openEdit(b.getAttribute("data-edit")); }; });
    $$("[data-usage]").forEach(function (b) { b.onclick = function () { openUsage(b.getAttribute("data-usage")); }; });
    $("#pager select").onchange = function () { PAGE_SIZE = parseInt(this.value, 10) || 10; state.page = 1; render(); };
  }

  function find(code) { return state.rows.find(function (r) { return r.code === code; }); }

  function openModal(id) { var m = document.getElementById(id); m.classList.add("is-open"); m.setAttribute("aria-hidden", "false"); }
  function closeModal(m) { m.classList.remove("is-open"); m.setAttribute("aria-hidden", "true"); }
  $$("[data-close]").forEach(function (b) { b.onclick = function () { closeModal(b.closest(".adm-modal")); }; });

  function openEdit(code) {
    var r = find(code); if (!r) return;
    state.editing = r;
    $("#edit-code").value = r.code;
    $("#edit-status").value = r.status === "disabled" ? "disabled" : "active";
    $("#edit-cap").value = r.limit == null ? "" : r.limit;
    $("#edit-cap-item").style.display = r.type === "official" ? "none" : "";
    $("#btn-edit-save").disabled = r.type === "official";
    openModal("modal-edit");
  }

  $("#btn-edit-save").onclick = function () {
    var r = state.editing; if (!r) return;
    var cap = parseInt($("#edit-cap").value, 10);
    if (!cap || cap < r.used || cap > 100) { $("#edit-cap").closest(".adm-form-item").classList.add("is-error"); return; }
    r.limit = cap;
    r.status = $("#edit-status").value === "disabled" ? "disabled" : (r.used >= cap ? "exhausted" : "active");
    closeModal(document.getElementById("modal-edit"));
    render();
    U.toast("已保存：状态 " + STATUS[r.status] + "，上限 " + cap);
  };

  var USAGE_ALL = {};
  function makeUsage(used) {
    var list = [], statuses = ["success", "pending", "expired"];
    for (var i = 0; i < used; i++) {
      list.push({
        cif: "B" + (10000000 + i * 137).toString().slice(0, 8),
        name: "CLIENTE " + String.fromCharCode(65 + (i % 26)) + (i + 1),
        time: "2026-12-" + String(3 + (i % 26)).padStart(2, "0") + " 10:" + String(10 + (i % 40)).padStart(2, "0"),
        status: statuses[i % 3],
        invoice: i % 3 === 0 ? "ES2500" + String(1000 + i).slice(-4) : "—",
        cards: i % 3 === 0 ? "已发 1 张" : "—"
      });
    }
    return list;
  }

  function openUsage(code) {
    var r = find(code); if (!r) return;
    state.usageCode = r; state.usagePage = 1;
    state.usageSize = 10;
    $("#usage-size").value = "10";
    $("#modal-usage-title").textContent = "使用记录 · " + code;
    $("#usage-tip").textContent = r.type === "official" ? "官方码使用记录全量可查，每个 CIF 限领 1 张" : "同码最多 100 条使用记录；同一被邀请人仅绑定一个邀请人";
    USAGE_ALL[code] = USAGE_ALL[code] || makeUsage(r.type === "official" ? 1238 : r.used);
    renderUsage();
    openModal("modal-usage");
  }

  function renderUsage() {
    var r = state.usageCode, list = USAGE_ALL[r.code] || [];
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total / state.usageSize));
    if (state.usagePage > pages) state.usagePage = pages;
    var start = (state.usagePage - 1) * state.usageSize;
    $("#usage-count").textContent = "共 " + fmt(total) + " 条" + (r.type === "official" ? "" : "（上限 100）");
    $("#usage-total").textContent = "共 " + fmt(total) + " 条";
    $("#usage-rows").innerHTML = list.slice(start, start + state.usageSize).map(function (u) {
      return "<tr><td class='inv-mono'>" + u.cif + "</td><td>" + u.name + "</td><td class='muted'>" + u.time + "</td><td>" + BIND[u.status] + "</td><td class='inv-mono'>" + u.invoice + "</td><td>" + u.cards + "</td></tr>";
    }).join("");
    $("#usage-page-btns").innerHTML = Array.from({ length: Math.min(5, pages) }, function (_, i) {
      var n = i + 1;
      return '<button type="button" class="' + (n === state.usagePage ? "is-active" : "") + '" data-upage="' + n + '">' + n + "</button>";
    }).join("");
    $$("[data-upage]").forEach(function (b) { b.onclick = function () { state.usagePage = Number(b.getAttribute("data-upage")); renderUsage(); }; });
    $("#usage-prev").onclick = function () { if (state.usagePage > 1) { state.usagePage--; renderUsage(); } };
    $("#usage-next").onclick = function () { if (state.usagePage < pages) { state.usagePage++; renderUsage(); } };
    $("#usage-size").onchange = function () { state.usageSize = parseInt(this.value, 10) || 10; state.usagePage = 1; renderUsage(); };
  }

  $("#btn-official").onclick = function () {
    if (state.rows.some(function (r) { return r.type === "official"; })) { U.toast("官方邀请码已生成，仅一次"); return; }
    openModal("modal-official");
  };
  $("#btn-official-ok").onclick = function () {
    state.rows.unshift({ code: "MP-OFFICIAL-2027", type: "official", custNo: "—", taxId: "—", used: 0, limit: null, status: "active", created: "2026-11-20 10:00:00" });
    closeModal(document.getElementById("modal-official"));
    render();
    $("#btn-official").disabled = true;
    $("#btn-official").textContent = "官方码已生成";
    U.toast("官方邀请码已生成（仅一次）");
  };

  function resetOfficialDemo() {
    state.rows = state.rows.filter(function (r) { return r.type !== "official"; });
    $("#btn-official").disabled = false;
    $("#btn-official").textContent = "生成官方邀请码";
    render();
  }

  $("#btn-search").onclick = function () {
    var code = $("#f-code").value.trim(), cust = $("#f-cust").value.trim(), tax = $("#f-tax").value.trim(), type = $("#f-type").value, st = $("#f-status").value;
    state.rows = ROWS.filter(function (r) {
      return (!code || r.code.indexOf(code) >= 0) &&
        (!cust || (r.custNo || "").indexOf(cust) >= 0) &&
        (!tax || (r.taxId || "").toLowerCase().indexOf(tax.toLowerCase()) >= 0) &&
        (!type || r.type === type) && (!st || r.status === st);
    });
    state.page = 1; render();
    U.toast("查询完成，共 " + state.rows.length + " 条");
  };
  $("#btn-reset").onclick = function () { $("#filters").reset(); state.rows = ROWS.slice(); state.page = 1; render(); U.toast("已重置"); };
  $("#btn-export").onclick = function () { U.toast("导出当前筛选结果（演示）"); };

  window.DEMOS = [
    { label: "使用记录（普通码）", fn: function () { openUsage("MP2027A8K3"); } },
    { label: "使用记录（官方码）", fn: function () { openUsage("MP-OFFICIAL-2027"); } },
    { label: "编辑邀请码", fn: function () { openEdit("MP2027B2C4"); } },
    { label: "体验生成官方码", fn: function () { resetOfficialDemo(); } }
  ];

  // 初始：官方码已生成
  $("#btn-official").disabled = true;
  $("#btn-official").textContent = "官方码已生成";
  render();
})();
</script>
</body>
</html>
